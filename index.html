<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP ANALYZER V12.1.4</title>
     <link rel="manifest" href="/manifest.json">  
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --hrc-purple: #e040fb; --hrc-orange: #ff9900; --hrc-yellow: #ffff00; }
        html, body { overflow: hidden; width: 100%; height: 100%; background: #000; margin: 0; padding: 0; font-family: sans-serif; color: #fff; position: fixed; 
    touch-action: none;}
        #main-container { display: flex; height: calc(100vh - 105px); width: 100%; }
        #map { width: 35%; height: 100%; border-right: 1px solid #444; background: #111; position: relative; z-index: 1; }
        #chart-area { width: 65%; height: 100%; background: #000; position: relative; z-index: 1; }

        /* Dashboard Fixed for Dragging */
        #data-dashboard { 
            position: fixed; 
            z-index: 9999; 
            background: rgba(0,0,0,0.9); 
            border-radius: 8px; 
            border: 2px solid #666; 
            min-width: 180px; 
            touch-action: none;
            /* 初期位置は右上に配置 */
            top: 20px;
            right: 20px;
        }
        .panel-header { 
            background: #333; 
            color: #fff; 
            font-size: 11px; 
            padding: 10px; 
            text-align: center; 
            cursor: move; 
            border-radius: 6px 6px 0 0; 
            user-select: none;
            font-weight: bold;
            border-bottom: 1px solid #444;
        }

        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 11px; pointer-events: none; }
        .dash-grid { display: grid; gap: 8px; text-align: right; margin-bottom: 4px; align-items: center; }
        .grid-label { text-align: left; color: #888; min-width: 50px; }
        .comp-only { display: none; }

       #map-adjust-ctrls { 
    position: absolute; 
    top: 10px; 
    left: 10px; 
    z-index: 1000; 
    display: grid; 
    /* 3列×2行の非常にタイトなグリッド */
    grid-template-columns: repeat(3, 35px); 
    grid-template-rows: repeat(2, 35px);
    gap: 2px; 
    padding-top: env(safe-area-inset-top);
}

/* 補正ボタン自体のサイズも少し小さくして邪魔にならないようにします */
.adj-btn { 
    width: 35px; 
    height: 35px; 
    background: rgba(0,0,0,0.6); /* 透過を強めて地図を見やすく */
    color: #fff; 
    border: 1px solid rgba(255,255,255,0.5); 
    border-radius: 4px; 
    font-size: 14px; 
    cursor: pointer; 
}

        #lap-list-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; flex-direction: column; padding: 15px; box-sizing: border-box; }
        #lap-list-content { overflow-y: auto; margin-top: 10px; border-top: 1px solid #333; }
        .lap-row { display: grid; grid-template-columns: 40px repeat(4, 1fr) 1.2fr 0.8fr 0.8fr; gap: 2px; padding: 12px 2px; border-bottom: 1px solid #222; cursor: pointer; text-align: center; font-size: 11px; color: #fff; }
        .lap-row.sel-p { background: rgba(51, 204, 255, 0.2); outline: 1px solid var(--hrc-blue); }
        .lap-row.sel-s { background: rgba(255, 68, 68, 0.2); outline: 1px solid var(--hrc-red); }
        
        .val-best { color: var(--hrc-purple) !important; font-weight: bold; }
        .lap-best { color: var(--hrc-red) !important; font-weight: bold; }
        .stat-best { background: var(--hrc-orange); color: #000 !important; font-weight: bold; border-radius: 2px; }
        .line-label { background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; padding: 2px 4px; font-size: 10px; border-radius: 3px; }

        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #111; z-index: 999; padding: 5px; box-sizing: border-box; }
        .ctrl-row { display: flex; align-items: center; gap: 5px; height: 45px; overflow-x: auto; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 11px; height: 35px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        #seek-bar { width: 100%; height: 40px; accent-color: var(--hrc-red); }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map">
       <div id="map-adjust-ctrls">
    <button class="adj-btn" style="grid-column: 2; grid-row: 1;" onclick="adjustMap(0.00001, 0)">↑</button>
    
    <button class="adj-btn" style="grid-column: 1; grid-row: 2;" onclick="adjustMap(0, -0.00001)">←</button>
    <button class="adj-btn" style="grid-column: 2; grid-row: 2;" onclick="adjustMap(-0.00001, 0)">↓</button>
    <button class="adj-btn" style="grid-column: 3; grid-row: 2;" onclick="adjustMap(0, 0.00001)">→</button>
</div>
    </div>
    <div id="chart-area">
        <div id="data-dashboard">
            <div class="panel-header" id="dash-handle">✜ DRAG HERE</div>
            <div id="dash-content">
                <div class="dash-grid" id="dash-header" style="font-weight:bold; border-bottom:1px solid #444; padding-bottom:5px;">
                    <span class="grid-label">ITEM</span><span id="label-p">DATA</span><span id="label-s" class="comp-only">REF</span>
                </div>
                <div class="dash-grid"><span class="grid-label">LAP#</span><span id="p-lap-id">-</span><span id="s-lap-id" class="comp-only">-</span></div>
                <div class="dash-grid"><span class="grid-label">SPD</span><span id="p-spd">-</span><span id="s-spd" class="comp-only">-</span></div>
                <div class="dash-grid"><span class="grid-label">RPM</span><span id="p-rpm">-</span><span id="s-rpm" class="comp-only">-</span></div>
                <hr style="border:0; border-top:1px solid #333;">
                <div class="dash-grid"><span class="grid-label">S1</span><span id="p-s1">-</span><span id="s-s1" class="comp-only">-</span></div>
                <div class="dash-grid"><span class="grid-label">S2</span><span id="p-s2">-</span><span id="s-s2" class="comp-only">-</span></div>
                <div class="dash-grid"><span class="grid-label">S3</span><span id="p-s3">-</span><span id="s-s3" class="comp-only">-</span></div>
                <div class="dash-grid"><span class="grid-label">S4</span><span id="p-s4">-</span><span id="s-s4" class="comp-only">-</span></div>
                <hr style="border:0; border-top:1px solid #333;">
                <div class="dash-grid" style="color:var(--hrc-yellow)"><span class="grid-label">A-B</span><span id="p-ab">-</span><span id="s-ab" class="comp-only">-</span></div>
                <div id="delta-row" class="comp-only dash-grid" style="margin-top:5px; padding-top:5px; border-top:1px solid #444; color:var(--hrc-green);">
                    <span class="grid-label">DIFF</span><span id="delta-val" style="grid-column: span 2; font-weight:bold;">0.000s</span>
                </div>
            </div>
        </div>
        <div style="height:100%; width:100%;"><canvas id="mainChart"></canvas></div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">OPEN GPX</button>
        <button class="mini-btn" id="openListBtn" style="background:var(--hrc-blue)">LAP LIST</button>
        <button class="mini-btn" id="btnSetA" style="background:var(--hrc-yellow); color:#000">SET A</button>
        <button class="mini-btn" id="btnSetB" style="background:var(--hrc-yellow); color:#000">SET B</button>
        <div class="ctrl-row">
    <button class="mini-btn" id="btnDyno" style="background:var(--hrc-purple)">DYNO</button>
    </div>
        <button class="mini-btn" onclick="location.reload()">RESET</button>
    </div>
    <input type="range" id="seek-bar" value="0">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<div id="lap-list-overlay">
    <h3 style="text-align:center; color:#888;">LAP DATA HISTORY</h3>
    <div id="lap-list-content"></div>
    <button class="mini-btn" style="margin-top:15px; width:100%; height:50px; background:var(--hrc-blue); font-size:16px;" onclick="closeLapList()">LOAD ANALYSIS</button>
</div>

<script>
'use strict';
let map, markerP, markerS, mainChart, lapDataStore = [], currentFrame = 0, isPlaying = false;
let primaryIdx = 0, secondaryIdx = null, autoLines = {}, idxA = null, idxB = null;
let latOffset = 0, lonOffset = 0;

window.onload = () => {
    // attributionControl: false を追加してデフォルトの大きな表示を消す
  // map の初期化部分を修正
map = L.map('map', { 
    zoomControl: false, 
    maxZoom: 24,           // ここを24くらいまで上げると、数cm単位のラインが見えます
    attributionControl: false 
}).setView([35.68, 139.76], 15);
    
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 24,           // 地図をどこまでズーム操作できるか
    maxNativeZoom: 18      // 実際の画像データが存在する限界（Esriの場合は18〜19が安全）
}).addTo(map);

    // 隅っこに小さく表示させる（邪魔にならない程度）
    L.control.attribution({ prefix: 'Esri' }).addTo(map);
    
    markerP = L.circleMarker([0,0], {color:'#33ccff', fillColor:'#000', radius:7, fillOpacity:1, weight:3}).addTo(map);
    markerS = L.circleMarker([0,0], {color:'#ff4444', fillColor:'#000', radius:7, fillOpacity:1, weight:3}).addTo(map);
    makeDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));
// --- ここから追加 ---
    const seekBar = document.getElementById('seek-bar');

    // タッチ開始時にブラウザの「引っ張って更新」などを阻止
    seekBar.addEventListener('touchstart', (e) => {
        // スワイプがシークバー上で行われている間、他の挙動（画面スクロール等）を止める
        e.stopPropagation(); 
    }, { passive: false });

    // 指を動かしている最中の処理（反応速度と安定性を向上）
    seekBar.addEventListener('touchmove', (e) => {
        e.stopPropagation();
        e.target.value = e.target.value;
        // 指の動きに合わせてフレームを即時更新
        currentFrame = parseInt(e.target.value);
        updateFrame();
    }, { passive: false });
    // --- ここまで ---

    
};
// --- Improved Drag Logic (Fixes the Stretching issue) ---
function makeDraggable(el, handle) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    handle.onmousedown = dragStart;
    handle.ontouchstart = dragStart;

    function dragStart(e) {
        e = e || window.event;
        e.preventDefault();
        
        // 重要：ドラッグ開始時に現在位置を確定し、右端固定を解除する
        const rect = el.getBoundingClientRect();
        el.style.right = 'auto'; 
        el.style.left = rect.left + 'px';
        el.style.top = rect.top + 'px';

        pos3 = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        pos4 = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        document.onmouseup = dragEnd;
        document.ontouchend = dragEnd;
        document.onmousemove = dragMove;
        document.ontouchmove = dragMove;
        e.preventDefault();
    }

    function dragMove(e) {
        let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        let cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
        
        pos1 = pos3 - cx;
        pos2 = pos4 - cy;
        pos3 = cx;
        pos4 = cy;
        
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
    }

    function dragEnd() {
        document.onmouseup = null;
        document.onmousemove = null;
        document.ontouchend = null;
        document.ontouchmove = null;
    }
}

function adjustMap(dLat, dLon) { latOffset += dLat; lonOffset += dLon; updateUI(); }

document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
    const reader = new FileReader();
    reader.onload = evt => {
        // --- 以前のデータを完全にリセット ---
        lapDataStore = []; 
        primaryIdx = 0;
        secondaryIdx = null;
        window.isMapInit = false; // これをfalseにしないと新しい場所にズームしません
        currentFrame = 0;
        idxA = null;
        idxB = null;
        // -------------------------------
        
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");
        parseMeta(xml); 
        processGPX(xml);
        
        // 読み込み完了後、自動的にラップリストを表示して選択を促す
        document.getElementById('lap-list-overlay').style.display = 'flex';
    };
    reader.readAsText(e.target.files[0]);
};

function parseMeta(xml) {
    autoLines = {};
    const desc = xml.getElementsByTagName('desc')[0]?.textContent;
    if (desc?.includes('LINE_DATA[')) {
        const match = desc.match(/LINE_DATA\[(.*?)\]/);
        if (match) match[1].split('|').forEach(item => {
            const [k, v] = item.split(':');
            if (v && v!=="SKIP") { 
                const c = v.split(',').map(Number); 
                autoLines[k] = { p1: {lat: c[0], lon: c[1]}, p2: {lat: c[2], lon: c[3]} }; 
            }
        });
    }
}
// --- 1. 方向判定ロジック（新規追加・修正） ---
// getIntersectの後に実行し、通過ベクトルとライン法線の内積で向きを判定します
function checkDirection(p1, p2, line) {
    // まず交差しているか確認
    if (!getIntersect(p1, p2, line)) return false;

    // 走行ベクトル (V)
    const vx = p2.lon - p1.lon;
    const vy = p2.lat - p1.lat;

    // ラインのベクトル (L)
    const lx = line.p2.lon - line.p1.lon;
    const ly = line.p2.lat - line.p1.lat;

    // ラインを右に見た時の法線ベクトル (N)
    // 数学的に垂直な向きを定義します
    const nx = ly;
    const ny = -lx;

    // 内積 (V · N) を計算。正なら順走、負なら逆走。
    return (vx * nx) + (vy * ny) > 0;
}
// --- 3. GPX解析・ラップ分割ロジック（修正版） ---
// --- 修正版：方向を自動判別してラップ分割する processGPX ---
function processGPX(xml) {
    const pts = xml.getElementsByTagName('trkpt');
    if (pts.length === 0) {
        alert("GPXデータが見つかりません。");
        return;
    }

    // --- ステップ1: データの完全初期化 ---
    let allPoints = [];
    let startTime = 0; 
    lapDataStore = []; // 前回の解析データをクリア

    // --- ステップ2: 全ポイントを配列に格納 ---
    for (let i = 0; i < pts.length; i++) {
        const lat = parseFloat(pts[i].getAttribute('lat'));
        const lon = parseFloat(pts[i].getAttribute('lon'));
        const timeStr = pts[i].getElementsByTagName('time')[0]?.textContent;
        const rawTime = timeStr ? new Date(timeStr).getTime() : 0;
        
        if (i === 0) startTime = rawTime;
        const relativeTime = rawTime - startTime;

        // 速度データの取得（拡張タグ or 標準タグ）
        let rawSpeedVal = NaN;
        const ext = pts[i].getElementsByTagName('extensions')[0];
        let speedNode = ext ? ext.getElementsByTagName('speed')[0] : null;
        if (!speedNode) speedNode = pts[i].getElementsByTagName('speed')[0];

        if (speedNode) {
            rawSpeedVal = parseFloat(speedNode.textContent);
        }

        // エンジン回転数（RPM）の取得
        let rpm = 0;
        if (ext) {
            const rTag = ext.getElementsByTagName('rpm')[0] || 
                         ext.getElementsByTagName('ns3:rpm')[0] || 
                         ext.getElementsByTagName('hr')[0];
            rpm = parseInt(rTag?.textContent || 0);
        }

        allPoints.push({ lat, lon, time: relativeTime, rawSpeed: rawSpeedVal, rpm });
    }

    // --- ステップ3: ラップ分割ロジック ---
    let isReverse = false;
    let directionFixed = false;
    // 最初のラップの初期化
    let cur = { coords:[], times:[], rpms:[], speeds:[], rawTimes:[] };
    let lastSL = allPoints[0].time; 

    for (let i = 0; i < allPoints.length; i++) {
        const p = allPoints[i];
        cur.coords.push([p.lat, p.lon]);
        cur.rpms.push(p.rpm);
        cur.rawTimes.push(p.time);

        // 速度の確定 (km/h)
        if (i > 0) {
            const pPrev = allPoints[i-1];
            let s_kmh = 0;
            if (!isNaN(p.rawSpeed)) {
                s_kmh = p.rawSpeed * 3.6; // m/s -> km/h
            } else {
                // 速度データ欠落時の計算
                const p1 = L.latLng(pPrev.lat, pPrev.lon);
                const p2 = L.latLng(p.lat, p.lon);
                const dist = p1.distanceTo(p2);
                const dt = (p.time - pPrev.time) / 1000;
                s_kmh = (dt > 0) ? (dist / dt) * 3.6 : 0;
            }
            cur.speeds.push(s_kmh);
        } else {
            cur.speeds.push(0);
        }

        // コントロールライン（SL）との交差判定
        if (i > 0 && autoLines.SL) {
            const pPrev = allPoints[i-1];
            if (getIntersect(pPrev, p, autoLines.SL)) {
                // 方向判定（ベクトルの内積）
                const vx = p.lon - pPrev.lon, vy = p.lat - pPrev.lat;
                const lx = autoLines.SL.p2.lon - autoLines.SL.p1.lon, ly = autoLines.SL.p2.lat - autoLines.SL.p1.lat;
                const dot = (vx * ly) + (vy * -lx);
                
                // 最初の通過で走行方向を固定
                if (!directionFixed) { 
                    isReverse = (dot < 0); 
                    directionFixed = true; 
                }
                
                const isCorrectDirection = isReverse ? (dot < 0) : (dot > 0);

                // 5秒以上の間隔がある場合のみ新しいラップとして確定
                if (isCorrectDirection && (p.time - lastSL > 5000)) {
                    // 現在のラップを保存
                    cur.times = cur.rawTimes.map(t => (t - cur.rawTimes[0]) / 1000);
                    cur.duration = (p.time - lastSL) / 1000; 
                    lapDataStore.push(cur);
                    
                    // 次のラップの準備
                    cur = { coords:[[p.lat, p.lon]], times:[], rpms:[p.rpm], speeds:[0], rawTimes:[p.time] };
                    lastSL = p.time;
                }
            }
        }
    }

    // 走行終了後の未確定セグメントを最後のラップとして保存（10点以上ある場合）
    if (cur.coords.length > 10) {
        cur.times = cur.rawTimes.map(t => (t - cur.rawTimes[0]) / 1000);
        cur.duration = (allPoints[allPoints.length-1].time - lastSL) / 1000;
        lapDataStore.push(cur);
    }

    // --- ステップ4: UIの更新 ---
    renderLapList();
    if (lapDataStore.length > 0) {
        primaryIdx = 0; // デフォルトで最初のラップを選択
        updateUI();
    }
}
// --- 2. 交差判定ロジック（既存） ---
function getIntersect(p1, p2, line) {
    const x1=p1.lon, y1=p1.lat, x2=p2.lon, y2=p2.lat, x3=line.p1.lon, y3=line.p1.lat, x4=line.p2.lon, y4=line.p2.lat;
    const den = (y4-y3)*(x2-x1)-(x4-x3)*(y2-y1);
    if (den === 0) return false;
    const ua = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/den, ub = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/den;
    return (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1);
}
function calculateSectors(lap) {
    let s1 = null, s2 = null, s3 = null;
    for (let j = 1; j < lap.coords.length; j++) {
        const p1 = {lat: lap.coords[j-1][0], lon: lap.coords[j-1][1]}, p2 = {lat: lap.coords[j][0], lon: lap.coords[j][1]};
        if (!s1 && autoLines.S1 && getIntersect(p1, p2, autoLines.S1)) s1 = lap.times[j];
        if (!s2 && autoLines.S2 && getIntersect(p1, p2, autoLines.S2)) s2 = lap.times[j];
        if (!s3 && autoLines.S3 && getIntersect(p1, p2, autoLines.S3)) s3 = lap.times[j];
    }
    
    // 全体の走行時間(秒)
    const totalTime = lap.duration; 
    
    // lastT: 最後に通過した計測ポイントの「開始からの経過秒数」
    const lastT = s3 || s2 || s1;
    
    return { 
        s1: s1 || 999, 
        s2: (s1 && s2) ? (s2 - s1) : 999, 
        s3: (s2 && s3) ? (s3 - s2) : 999, 
        // 修正点：totalTimeは既に秒単位なので、そのままlastTを引く
        s4: lastT ? (totalTime - lastT) : 999 
    };
}

function renderLapList() {
    const c = document.getElementById('lap-list-content');
    if(!c || lapDataStore.length === 0) return;
    
    const lapsSectors = lapDataStore.map(l => calculateSectors(l));
    const bestS1 = Math.min(...lapsSectors.map(s => s.s1));
    const bestS2 = Math.min(...lapsSectors.map(s => s.s2));
    const bestS3 = Math.min(...lapsSectors.map(s => s.s3));
    const bestS4 = Math.min(...lapsSectors.map(s => s.s4));
    const bestTotal = Math.min(...lapDataStore.map(l => l.duration)); 
    
    const globalMaxS = Math.max(...lapDataStore.map(l => Math.max(...l.speeds)));
    const globalMaxR = Math.max(...lapDataStore.map(l => Math.max(...l.rpms)));

    // ヘッダーからTEMPを削除
    c.innerHTML = `<div class="lap-row list-header"><span>LAP</span><span>S1</span><span>S2</span><span>S3</span><span>S4</span><span>TOTAL</span><span>MAX S</span><span>MAX R</span></div>`;
    
    lapDataStore.forEach((l, i) => {
        const s = lapsSectors[i]; 
        const maxS = Math.max(...l.speeds); 
        const maxR = Math.max(...l.rpms);
        const div = document.createElement('div');
        div.className = `lap-row ${primaryIdx===i?'sel-p':''} ${secondaryIdx===i?'sel-s':''}`;
        
        const wrapBest = (val, best) => `<span class="${val===best?'val-best':''}">${val===999?'--':val.toFixed(3)}</span>`;
        
        // duration(秒)とmaxS(km/h)をそのまま小数点・整数で表示
        div.innerHTML = `
            <span>L${i}</span>
            ${wrapBest(s.s1, bestS1)}
            ${wrapBest(s.s2, bestS2)}
            ${wrapBest(s.s3, bestS3)}
            ${wrapBest(s.s4, bestS4)}
            <span class="${l.duration===bestTotal?'lap-best':''}">${l.duration.toFixed(3)}s</span>
            <span class="${maxS >= globalMaxS && maxS > 0 ? 'stat-best' : ''}">${Math.round(maxS)}</span>
            <span class="${maxR >= globalMaxR && maxR > 0 ? 'stat-best' : ''}">${maxR}</span>
        `;
        div.onclick = () => { 
            if(primaryIdx===i) primaryIdx=null; else if(secondaryIdx===i) secondaryIdx=null; 
            else if(primaryIdx===null) primaryIdx=i; else secondaryIdx=i; renderLapList(); 
        };
        c.appendChild(div);
    });
}
function closeLapList() { 
    document.getElementById('lap-list-overlay').style.display='none'; 
    const isComp = (secondaryIdx !== null);
    document.querySelectorAll('.dash-grid').forEach(g => g.style.gridTemplateColumns = isComp ? "50px 70px 70px" : "50px 80px");
    document.querySelectorAll('.comp-only').forEach(el => el.style.display = isComp ? "block" : "none");
    updateUI(); 
}

function updateUI() {
    // データがない場合は処理を中断
    if (primaryIdx === null || lapDataStore.length === 0) return;
    
    const p = lapDataStore[primaryIdx];
    
    // 1. シークバーの最大値を現在のラップのデータ数に合わせる
    const seekBar = document.getElementById('seek-bar');
    if (seekBar) {
        seekBar.max = p.speeds.length - 1;
        // 再読み込み時（再生中でない時）はシーク位置を先頭に戻す
        if (!isPlaying) {
            currentFrame = 0;
            seekBar.value = 0;
        }
    }
    
    // 2. 既存の描画レイヤー（ヒートマップ、比較ライン、セクター線）を削除
    if (window.pathLayer) {
        map.removeLayer(window.pathLayer);
    }
    
    // 新しい描画グループを作成
    const g = L.featureGroup();
    
    // 3. メインラップのヒートマップ描画 (速度による色分け)
const movingSpeeds = p.speeds.filter(s => s > 5);
const maxS = Math.max(...p.speeds, 1); // 最低でも1にする
const minS = movingSpeeds.length > 0 ? Math.min(...movingSpeeds) : 0;
const range = (maxS - minS) || 1; // 0にならないようにする

    for(let i=1; i<p.coords.length; i++) {
        let ratio = range > 0 ? (p.speeds[i] - minS) / range : 0.5;
        ratio = Math.max(0, Math.min(1, ratio));

        let r = 0, g_val = 0, b = 0;
        if (ratio < 0.5) {
            g_val = Math.floor(255 * (ratio * 2));
            b = Math.floor(255 * (1 - ratio * 2));
        } else {
            r = Math.floor(255 * ((ratio - 0.5) * 2));
            g_val = Math.floor(255 * (1 - (ratio - 0.5) * 2));
        }
        
        const color = `rgb(${r}, ${g_val}, ${b})`;

        L.polyline([
            [p.coords[i-1][0] + latOffset, p.coords[i-1][1] + lonOffset],
            [p.coords[i][0] + latOffset, p.coords[i][1] + lonOffset]
        ], {
            color: color, 
            weight: 5,   // メインの太さ
            opacity: 1
        }).addTo(g);
    }
    
    // 4. 比較用ラップ(Secondary)の描画
    if(secondaryIdx !== null && lapDataStore[secondaryIdx]) {
        const sLap = lapDataStore[secondaryIdx];
        const sCoords = sLap.coords.map(c => [c[0] + latOffset, c[1] + lonOffset]);
        
        // 下地：黒の縁取り
        L.polyline(sCoords, {
            color: '#000',
            weight: 5,
            opacity: 0.8
        }).addTo(g);

        // 上書き：白の破線
        L.polyline(sCoords, {
            color: '#fff',
            weight: 3,
            dashArray: '10, 12', 
            opacity: 1
        }).addTo(g);
    }
    
    // 5. スタートライン・セクターラインの描画
    Object.keys(autoLines).forEach(key => {
        const line = autoLines[key];
        L.polyline([
            [line.p1.lat + latOffset, line.p1.lon + lonOffset], 
            [line.p2.lat + latOffset, line.p2.lon + lonOffset]
        ], {
            color: key === 'SL' ? '#fff' : '#ff0', 
            weight: 3
        }).addTo(g).bindTooltip(key, {
            permanent: true, 
            className: 'line-label', 
            direction: 'center'
        });
    });
    
    // 6. 全レイヤーを地図に追加
    window.pathLayer = g.addTo(map); 
    
    // 7. 地図の自動ズーム処理
    // ファイル読み込み直後（window.isMapInitがfalse）の場合のみ実行
    if(!window.isMapInit) { 
        const bounds = g.getBounds();
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [30, 30] }); 
            window.isMapInit = true; // ズーム完了フラグを立てる
        }
    }
    
    // 8. グラフとデータ表示の更新
    createCharts(); 
    updateFrame();
}
function createCharts() {
    const p = lapDataStore[primaryIdx];
    const datasets = [{ label:'SPD P', data:p.speeds, borderColor:'#33ccff', pointRadius:0, yAxisID:'y', borderWidth:3 },{ label:'RPM P', data:p.rpms, borderColor:'rgba(0,255,0,0.6)', pointRadius:0, yAxisID:'y1', borderDash:[2,2] }];
    if (secondaryIdx !== null) {
        const s = lapDataStore[secondaryIdx];
        datasets.push({ label:'SPD S', data:s.speeds, borderColor:'#ff4444', pointRadius:0, yAxisID:'y', borderWidth:3 });
        datasets.push({ label:'RPM S', data:s.rpms, borderColor:'rgba(255,165,0,0.6)', pointRadius:0, yAxisID:'y1', borderDash:[2,2] });
    }
    if (mainChart) mainChart.destroy();
    const annotations = { now: { type: 'line', xMin: currentFrame, xMax: currentFrame, borderColor: '#fff', borderWidth: 2 } };
    if (idxA !== null) annotations.lineA = { type: 'line', xMin: idxA, xMax: idxA, borderColor: '#ffff00', borderWidth: 1, borderDash: [5, 5] };
    if (idxB !== null) annotations.lineB = { type: 'line', xMin: idxB, xMax: idxB, borderColor: '#ffff00', borderWidth: 1, borderDash: [5, 5] };
    mainChart = new Chart(document.getElementById('mainChart').getContext('2d'), {
        type:'line', data:{ labels:p.times.map((_,i)=>i), datasets },
        options:{ responsive:true, maintainAspectRatio:false, animation:false, scales:{ x:{display:false}, y:{position:'left', min:0}, y1:{position:'right', min:0, grid:{display:false}} }, plugins:{ legend:{display:false}, annotation:{ annotations } } }
    });
}

function updateFrame() {
    if (primaryIdx === null || lapDataStore.length === 0) return;
    const p = lapDataStore[primaryIdx]; const idx = Math.min(currentFrame, p.speeds.length-1);
    markerP.setLatLng([p.coords[idx][0]+latOffset, p.coords[idx][1]+lonOffset]);
    const s = calculateSectors(p);
    document.getElementById('p-lap-id').innerText = primaryIdx;
    document.getElementById('p-spd').innerText = Math.round(p.speeds[idx]);
    document.getElementById('p-rpm').innerText = p.rpms[idx];
    document.getElementById('p-s1').innerText = s.s1===999?'--':s.s1.toFixed(3);
    document.getElementById('p-s2').innerText = s.s2===999?'--':s.s2.toFixed(3);
    document.getElementById('p-s3').innerText = s.s3===999?'--':s.s3.toFixed(3);
    document.getElementById('p-s4').innerText = s.s4===999?'--':s.s4.toFixed(3);
    if (idxA !== null && idxB !== null) document.getElementById('p-ab').innerText = Math.abs(p.times[idxB] - p.times[idxA]).toFixed(3) + "s";
    if (secondaryIdx !== null) {
        const ref = lapDataStore[secondaryIdx]; const rIdx = Math.min(currentFrame, ref.speeds.length-1);
        markerS.setLatLng([ref.coords[rIdx][0]+latOffset, ref.coords[rIdx][1]+lonOffset]);
        const rs = calculateSectors(ref);
        document.getElementById('s-lap-id').innerText = secondaryIdx;
        document.getElementById('s-spd').innerText = Math.round(ref.speeds[rIdx]);
        document.getElementById('s-rpm').innerText = ref.rpms[rIdx];
        document.getElementById('s-s1').innerText = rs.s1===999?'--':rs.s1.toFixed(3);
        document.getElementById('s-s2').innerText = rs.s2===999?'--':rs.s2.toFixed(3);
        document.getElementById('s-s3').innerText = rs.s3===999?'--':rs.s3.toFixed(3);
        document.getElementById('s-s4').innerText = rs.s4===999?'--':rs.s4.toFixed(3);
        document.getElementById('delta-val').innerText = (p.times[idx] - ref.times[rIdx]).toFixed(3) + "s";
        if (idxA !== null && idxB !== null) document.getElementById('s-ab').innerText = Math.abs(ref.times[idxB] - ref.times[idxA]).toFixed(3) + "s";
    }
    if(mainChart){ mainChart.options.plugins.annotation.annotations.now.xMin=idx; mainChart.options.plugins.annotation.annotations.now.xMax=idx; mainChart.update('none'); }
}

document.getElementById('btnSetA').onclick = () => { idxA = currentFrame; createCharts(); updateFrame(); };
document.getElementById('btnSetB').onclick = () => { idxB = currentFrame; createCharts(); updateFrame(); };
document.getElementById('openListBtn').onclick = () => document.getElementById('lap-list-overlay').style.display='flex';

document.getElementById('playBtn').onclick = function() { isPlaying = !isPlaying; this.innerText = isPlaying ? "PAUSE" : "PLAY"; if(isPlaying) animate(); };
function animate() { if(!isPlaying) return; if(currentFrame >= lapDataStore[primaryIdx].speeds.length-1) { isPlaying=false; document.getElementById('playBtn').innerText="PLAY"; return; } currentFrame++; document.getElementById('seek-bar').value = currentFrame; updateFrame(); requestAnimationFrame(animate); }
let dynoChart = null;

document.getElementById('btnDyno').onclick = () => {
    if (idxA === null || idxB === null) {
        alert("SET A と SET B を選択してください");
        return;
    }

    const config = JSON.parse(localStorage.getItem('klap_dyno_config') || JSON.stringify({
        weight: 150, f_spkt: 14, r_spkt: 42, tire: 1.38, primary: 4.117, ratio: 1.318
    }));

    const inputStr = prompt(
        "解析パラメーターを入力してください\n[総重量, Fスプロケ, Rスプロケ, タイヤ周長(m), 一次減速比, ギア変速比]", 
        `${config.weight}, ${config.f_spkt}, ${config.r_spkt}, ${config.tire}, ${config.primary}, ${config.ratio}`
    );

    if (!inputStr) return;
    const [w, fs, rs, t, pri, rat] = inputStr.split(',').map(v => parseFloat(v.trim()));
    if ([w, fs, rs, t, pri, rat].some(isNaN)) return;
    localStorage.setItem('klap_dyno_config', JSON.stringify({weight:w, f_spkt:fs, r_spkt:rs, tire:t, primary:pri, ratio:rat}));

    const finalRatio = rs / fs;
    const start = Math.min(idxA, idxB);
    const end = Math.max(idxA, idxB);

    // --- 計算関数 (内部用) ---
    const calculateDynoData = (lapIdx) => {
        if (lapIdx === null || !lapDataStore[lapIdx]) return [];
        const lap = lapDataStore[lapIdx];
        const res = [];
        
        // 速度スムージング
        const sV = lap.speeds.map((v, i, a) => 
            (i > 0 && i < a.length - 1) ? (a[i-1] + v + a[i+1]) / 3 : v
        );

        for (let i = start + 1; i <= end; i++) {
            if (!sV[i] || !sV[i-1]) continue;
            const v_ms = sV[i] / 3.6;
            const dt = (lap.rawTimes[i] - lap.rawTimes[i-1]) / 1000;
            const wheel_rpm = (sV[i] * 1000 / 60) / t;
            const rpm = Math.round(wheel_rpm * finalRatio * pri * rat);

            if (dt > 0 && rpm > 0) {
                const a = (v_ms - (sV[i-1] / 3.6)) / dt;
                const ps = (w * a * v_ms) / 735.5;
                if (ps > 0 && ps < 100 && rpm > 1000 && rpm < 20000) { 
                    res.push({ x: rpm, y: ps });
                }
            }
        }
        return res.sort((a, b) => a.x - b.x);
    };

    const dataP = calculateDynoData(primaryIdx);
    const dataS = calculateDynoData(secondaryIdx);

    document.getElementById('dyno-overlay').style.display = 'flex';
    renderDynoChart(dataP, dataS);
};

function renderDynoChart(dataP, dataS) {
    const ctx = document.getElementById('dynoChart').getContext('2d');
    if (window.dynoChartInstance) window.dynoChartInstance.destroy();

    const datasets = [{
        label: 'Primary (Blue)',
        data: dataP,
        borderColor: '#33ccff',
        backgroundColor: 'rgba(51, 204, 255, 0.2)',
        showLine: true,
        tension: 0.4,
        pointRadius: 2
    }];

    if (dataS.length > 0) {
        datasets.push({
            label: 'Secondary (Red)',
            data: dataS,
            borderColor: '#ff4444',
            backgroundColor: 'rgba(255, 68, 68, 0.2)',
            showLine: true,
            tension: 0.4,
            pointRadius: 2
        });
    }

    window.dynoChartInstance = new Chart(ctx, {
        type: 'scatter',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: { type: 'linear', title: { display: true, text: 'RPM', color: '#888' }, grid: { color: '#222' } },
                y: { title: { display: true, text: 'PS', color: '#888' }, min: 0, grid: { color: '#222' } }
            },
            plugins: {
                legend: { display: true, labels: { color: '#fff' } }
            }
        }
    });
}
</script>

<div id="dyno-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:20000; flex-direction:column; padding:15px; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0; color:var(--hrc-purple); font-size:18px;">DYNO ANALYSIS (PS vs RPM)</h3>
        <button class="mini-btn" style="width:80px; background:#666;" onclick="document.getElementById('dyno-overlay').style.display='none'">CLOSE</button>
    </div>
    <div style="flex-grow:1; background:#000; border:1px solid #333; border-radius:8px; position:relative; overflow:hidden;">
        <canvas id="dynoChart"></canvas>
    </div>
    <p style="font-size:10px; color:#666; margin-top:10px; text-align:center;">※SET A-B間の加速データから算出（3点スムージング適用）</p>
</div>

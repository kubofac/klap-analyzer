<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP ANALYZER V11.5.6</title>
    <link rel="manifest" href="/manifest.json">  

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --hrc-green: #00ff00; --bg-dark: #0a0a0a; --sec-yellow: #ffff00; }
        html, body { overflow: hidden; position: fixed; width: 100%; height: 100%; background: #000; margin: 0; padding: 0; font-family: sans-serif; }
        #main-container { display: flex; height: calc(100vh - 105px); width: 100%; }
        #map { width: 45%; height: 100%; border-right: 1px solid var(--hrc-red); background: #222; position: relative; }
        #chart-area { width: 55%; height: 100%; background: #111; display: flex; flex-direction: column; position: relative; }
        .chart-container-top { flex: 4; position: relative; padding: 5px; min-height: 0; }
        .chart-container-btm { flex: 1; position: relative; border-top: 1px solid #444; background: #000; padding: 5px; min-height: 0; }
        .draggable-panel { position: absolute; z-index: 5000; background: rgba(0,0,0,0.85); border-radius: 10px; border: 2px solid #555; overflow: hidden; width: 200px; touch-action: none; }
        .panel-header { background: #444; color: white; font-size: 11px; padding: 8px; text-align: center; cursor: move; font-weight: bold; user-select: none; }
        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; color: #fff; pointer-events: none; }
        .dash-row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
        #map-overlay-btns { position: absolute; bottom: 20px; left: 10px; z-index: 1000; display: flex; gap: 8px; }
        .map-btn { width: 50px; height: 50px; background: rgba(0,0,0,0.8); color: white; border: 2px solid var(--hrc-red); border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #111; padding: 5px; display: flex; flex-direction: column; z-index: 9999; }
        .ctrl-row { display: flex; align-items: center; gap: 4px; flex: 1; overflow-x: auto; white-space: nowrap; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 10px; font-weight: bold; height: 38px; flex-shrink: 0; cursor: pointer; }
        #seek-bar { width: 100%; height: 40px; accent-color: #ff4444; }
        #lap-list-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map">
        <div id="map-overlay-btns">
            <button class="map-btn" onclick="stepFrame(-1)">＜</button>
            <button class="map-btn" onclick="stepFrame(1)">＞</button>
        </div>
    </div>
    <div id="chart-area">
        <div id="data-dashboard" class="draggable-panel" style="top:10px; right:10px;">
            <div class="panel-header" id="dash-handle">✜ DASHBOARD (Drag)</div>
            <div id="dash-content">
                <div class="dash-row"><span>TIME:</span><span id="dash-time">0.00s</span></div>
                <div class="dash-row" style="color:var(--hrc-red)"><span>SPD:</span><span id="dash-spd">--- km/h</span></div>
                <div class="dash-row" style="color:var(--hrc-green)"><span>RPM:</span><span id="dash-rpm">---</span></div>
                <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
                <div class="dash-row"><span>S1:</span><span id="s1-val">--.---s</span></div>
                <div class="dash-row"><span>S2:</span><span id="s2-val">--.---s</span></div>
                <div class="dash-row"><span>S3:</span><span id="s3-val">--.---s</span></div>
                <div class="dash-row" style="color:var(--hrc-blue); font-weight:bold;"><span>MANUAL:</span><span id="manual-val">--.---s</span></div>
            </div>
        </div>
        <div class="chart-container-top"><canvas id="telemetryChart"></canvas></div>
        <div class="chart-container-btm"><canvas id="deltaChart"></canvas></div>
    </div>
</div>

<div id="lap-list-overlay">
    <div style="background:#1a1a1a; padding:15px; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:white; margin:0;">LAP LIST</h2>
        <button class="mini-btn" id="closeListBtn" style="background:var(--hrc-red)">CLOSE</button>
    </div>
    <div style="flex:1; overflow-y:auto; padding:10px;">
        <table style="width:100%; border-collapse:collapse; color:#fff; text-align:center;">
            <thead id="lap-table-head"></thead>
            <tbody id="lap-table-body"></tbody>
        </table>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">FILE OPEN</button>
        <button class="mini-btn" id="openListBtn" style="background:var(--hrc-blue)">LAP LIST</button>
        <button class="mini-btn" id="manualSetBtn" style="background:#fff; color:#000">SECTOR SET</button>
        <button class="mini-btn" onclick="location.reload()" style="background:#333">RESET</button>
    </div>
    <input type="range" id="seek-bar" value="0" min="0" step="1">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<script>
'use strict';
let map, marker1, telChart, lapDataStore = [], currentFrame = 0, isPlaying = false;
let primaryIdx = 0, s1Idx = null, s2Idx = null, s3Idx = null, manualIdx = null, autoLines = {};
let maxSpd = 10;

window.onload = () => {
    map = L.map('map', { zoomControl: false, maxZoom: 22 }).setView([35.68, 139.76], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);
    marker1 = L.circleMarker([0,0], {color:'#fff', fillColor:'#000', radius:8, fillOpacity:1, weight:2, zIndexOffset:1000}).addTo(map);
    initDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));
};

function initDraggable(el, handle) {
    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    handle.onmousedown = dragStart; handle.ontouchstart = dragStart;
    function dragStart(e) {
        const cx = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        const cy = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        pos3 = cx; pos4 = cy;
        document.onmouseup = dragEnd; document.ontouchend = dragEnd;
        document.onmousemove = dragMove; document.ontouchmove = dragMove;
    }
    function dragMove(e) {
        const cx = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        const cy = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        pos1 = pos3 - cx; pos2 = pos4 - cy; pos3 = cx; pos4 = cy;
        el.style.top = (el.offsetTop - pos2) + "px"; el.style.left = (el.offsetLeft - pos1) + "px";
    }
    function dragEnd() { document.onmouseup = null; document.onmousemove = null; document.ontouchend = null; document.ontouchmove = null; }
}

function stepFrame(dir) {
    currentFrame += dir;
    const max = lapDataStore[primaryIdx]?.speeds.length - 1 || 0;
    if(currentFrame < 0) currentFrame = 0;
    if(currentFrame > max) currentFrame = max;
    document.getElementById('seek-bar').value = currentFrame;
    updateFrame();
}

function getColor(spd) {
    const ratio = Math.min(1, spd / maxSpd);
    const hue = 240 - (ratio * 240); // 0(青)〜240(赤)
    return `hsl(${hue}, 100%, 50%)`;
}

document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = evt => {
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");
        parseLineData(xml);
        parseGPX(xml);
    };
    reader.readAsText(file);
};

function parseLineData(xml) {
    autoLines = {};
    const desc = xml.getElementsByTagName('desc')[0]?.textContent;
    if (desc && desc.includes('LINE_DATA[')) {
        try {
            const data = desc.match(/\[(.*?)\]/)[1];
            data.split('|').forEach(item => {
                const [key, val] = item.split(':');
                if (val) {
                    const c = val.split(',').map(Number);
                    autoLines[key] = { p1: {lat: c[0], lon: c[1]}, p2: {lat: c[2], lon: c[3]} };
                }
            });
        } catch(e) {}
    }
}

function parseGPX(xml) {
    const trks = xml.getElementsByTagName('trk');
    lapDataStore = [];
    let allBoundsPts = [];
    for (let i = 0; i < trks.length; i++) {
        const pts = trks[i].getElementsByTagName('trkpt');
        if (!pts.length) continue;
        let spds=[], crds=[], tms=[], rpms=[], dsts=[], dAcc=0;
        const startT = new Date(pts[0].getElementsByTagName('time')[0].textContent);
        for (let j = 0; j < pts.length; j++) {
            const lat = parseFloat(pts[j].getAttribute('lat')), lon = parseFloat(pts[j].getAttribute('lon'));
            let rpmValue = 0;
            const ext = pts[j].getElementsByTagName('extensions')[0];
            if(ext) {
                const rpmTag = ext.getElementsByTagName('rpm')[0];
                if(rpmTag) rpmValue = parseInt(rpmTag.textContent) || 0;
            }
            const time = (new Date(pts[j].getElementsByTagName('time')[0].textContent) - startT) / 1000;
            if (j > 0) dAcc += L.latLng(crds[j-1]).distanceTo([lat, lon]);
            crds.push([lat, lon]); spds.push(0); tms.push(time); rpms.push(rpmValue); dsts.push(dAcc); 
            allBoundsPts.push([lat, lon]);
        }
        for(let j=1; j<spds.length; j++) {
            let d = dsts[j]-dsts[j-1], t = tms[j]-tms[j-1];
            spds[j] = t > 0 ? Math.round((d/t)*3.6) : spds[j-1];
        }
        lapDataStore.push({ speeds: spds, coords: crds, times: tms, rpms: rpms, dists: dsts, duration: tms[tms.length-1] });
    }
    if (lapDataStore.length > 0) {
        const bounds = L.latLngBounds(allBoundsPts);
        if(bounds.isValid()) map.fitBounds(bounds);
        primaryIdx = 0; detectSectors(); updateUI();
    }
}

function updateUI() {
    const p = lapDataStore[primaryIdx];
    if(!p) return;
    
    // このラップの最高速を基準にする
    maxSpd = Math.max(...p.speeds, 10);

    document.getElementById('seek-bar').max = p.speeds.length - 1;
    if (window.pathLayer) map.removeLayer(window.pathLayer);
    const g = L.featureGroup();
    for (let i = 1; i < p.coords.length; i++) {
        L.polyline([p.coords[i-1], p.coords[i]], { color: getColor(p.speeds[i]), weight: 6, opacity: 0.8 }).addTo(g);
    }
    Object.keys(autoLines).forEach(k => {
        const l = autoLines[k];
        L.polyline([[l.p1.lat, l.p1.lon], [l.p2.lat, l.p2.lon]], {color: k==='SL'?'#fff':'#ff0', weight: 4}).addTo(g);
    });
    window.pathLayer = g.addTo(map);
    createCharts();
    updateFrame();
}

function updateFrame() {
    const p = lapDataStore[primaryIdx];
    if(!p) return;
    const idx = Math.min(currentFrame, p.speeds.length - 1);
    marker1.setLatLng(p.coords[idx]);
    marker1.setStyle({fillColor: getColor(p.speeds[idx])});
    
    document.getElementById('dash-time').innerText = p.times[idx].toFixed(2) + "s";
    document.getElementById('dash-spd').innerText = p.speeds[idx] + " km/h";
    document.getElementById('dash-rpm').innerText = p.rpms[idx];
    document.getElementById('s1-val').innerText = s1Idx ? p.times[s1Idx].toFixed(3) + "s" : "--.---s";
    document.getElementById('s2-val').innerText = (s1Idx && s2Idx) ? (p.times[s2Idx] - p.times[s1Idx]).toFixed(3) + "s" : "--.---s";
    document.getElementById('s3-val').innerText = (s2Idx && s3Idx) ? (p.times[s3Idx] - p.times[s2Idx]).toFixed(3) + "s" : "--.---s";
    document.getElementById('manual-val').innerText = manualIdx ? p.times[manualIdx].toFixed(3) + "s" : "--.---s";
    
    if(telChart){
        telChart.options.plugins.annotation.annotations.now.xMin = idx;
        telChart.options.plugins.annotation.annotations.now.xMax = idx;
        telChart.update('none');
    }
}

function createCharts() {
    const ctxT = document.getElementById('telemetryChart').getContext('2d');
    const p = lapDataStore[primaryIdx];
    if (telChart) telChart.destroy();
    const annotations = { now: { type:'line', xMin:0, xMax:0, borderColor:'#fff', borderWidth:2, zIndex:10 } };
    if(s1Idx) annotations.s1 = { type:'line', xMin:s1Idx, xMax:s1Idx, borderColor:'#ff0', borderWidth:1 };
    if(s2Idx) annotations.s2 = { type:'line', xMin:s2Idx, xMax:s2Idx, borderColor:'#ff0', borderWidth:1 };
    if(s3Idx) annotations.s3 = { type:'line', xMin:s3Idx, xMax:s3Idx, borderColor:'#ff0', borderWidth:1 };
    if(manualIdx) annotations.manual = { type:'line', xMin:manualIdx, xMax:manualIdx, borderColor:'#33ccff', borderWidth:2 };
    telChart = new Chart(ctxT, {
        type: 'line', data: { labels: p.times.map((_,i)=>i), datasets: [{ label:'SPD', data:p.speeds, borderColor:'#f44', pointRadius:0, yAxisID:'y' },{ label:'RPM', data:p.rpms, borderColor:'#0f0', pointRadius:0, yAxisID:'y1' }] },
        options: { responsive:true, maintainAspectRatio:false, animation:false, scales: { x:{display:false}, y1:{position:'right', grid:{display:false}} }, plugins: { legend:{display:false}, annotation:{annotations} } }
    });
}

function detectSectors() {
    s1Idx = null; s2Idx = null; s3Idx = null;
    if (!autoLines.S1) return;
    const p = lapDataStore[primaryIdx];
    for (let j = 1; j < p.coords.length; j++) {
        const l1 = {lat: p.coords[j-1][0], lon: p.coords[j-1][1]}, l2 = {lat: p.coords[j][0], lon: p.coords[j][1]};
        if (!s1Idx && getIntersect(l1, l2, autoLines.S1)) s1Idx = j;
        if (!s2Idx && getIntersect(l1, l2, autoLines.S2)) s2Idx = j;
        if (!s3Idx && getIntersect(l1, l2, autoLines.S3)) s3Idx = j;
    }
}
function getIntersect(p1, p2, line) {
    if (!line || !line.p1) return false;
    const x1=p1.lon, y1=p1.lat, x2=p2.lon, y2=p2.lat, x3=line.p2.lon, y3=line.p2.lat, x4=line.p1.lon, y4=line.p1.lat;
    const den = (y4-y3)*(x2-x1)-(x4-x3)*(y2-y1);
    if (Math.abs(den)<1e-12) return false;
    const t = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/den, u = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/den;
    return (t>=0 && t<=1 && u>=0 && u<=1);
}

function renderLapTable() {
    const tbody = document.getElementById('lap-table-body');
    const thead = document.getElementById('lap-table-head');
    thead.innerHTML = `<tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>TIME</th><th>MANUAL</th><th>MAX SPD</th></tr>`;
    tbody.innerHTML = '';
    lapDataStore.forEach((lap, i) => {
        const tr = document.createElement('tr');
        if (i === primaryIdx) tr.style.background = "rgba(255, 68, 68, 0.4)";
        tr.innerHTML = `<td>L${i+1}</td><td>--</td><td>--</td><td>--</td><td>${lap.duration.toFixed(3)}s</td><td style="color:var(--hrc-blue)">${manualIdx?lap.times[manualIdx].toFixed(2):'--'}</td><td>${Math.max(...lap.speeds)}</td>`;
        tr.onclick = () => { primaryIdx=i; detectSectors(); updateUI(); document.getElementById('lap-list-overlay').style.display='none'; };
        tbody.appendChild(tr);
    });
}

document.getElementById('manualSetBtn').onclick = () => { manualIdx = currentFrame; updateUI(); };
document.getElementById('openListBtn').onclick = () => { renderLapTable(); document.getElementById('lap-list-overlay').style.display = 'flex'; };
document.getElementById('closeListBtn').onclick = () => document.getElementById('lap-list-overlay').style.display = 'none';
document.getElementById('seek-bar').oninput = () => { currentFrame = parseInt(document.getElementById('seek-bar').value); updateFrame(); };
document.getElementById('playBtn').onclick = function() { isPlaying = !isPlaying; this.innerText = isPlaying ? "PAUSE" : "PLAY"; if(isPlaying) animate(); };
function animate() { if(!isPlaying) return; if(currentFrame >= lapDataStore[primaryIdx].speeds.length-1) { isPlaying=false; document.getElementById('playBtn').innerText="PLAY"; return; } currentFrame++; document.getElementById('seek-bar').value = currentFrame; updateFrame(); requestAnimationFrame(animate); }
</script>
</body>
</html>

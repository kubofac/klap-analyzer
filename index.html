<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>KLAP ANALYZER V6.9.9 (iOS Fix)</title>
      <link rel="manifest" href="/manifest.json">  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --bg-dark: #0a0a0a; }
        html, body { 
            background: var(--bg-dark); color: #eee; font-family: sans-serif; 
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            overflow: hidden; position: fixed; touch-action: none;
        }
        #main-container { display: flex; flex: 1; height: calc(100dvh - 95px); position: relative; }
        #map { width: 45%; height: 100%; border-right: 1px solid var(--hrc-red); background: #222; }
        #chart-area { width: 55%; height: 100%; background: #111; display: flex; flex-direction: column; position: relative; }
        .chart-box { flex: 1; padding: 5px; box-sizing: border-box; min-height: 0; touch-action: none; }
        #delta-area { height: 100px; border-top: 1px solid #444; background: #000; }
        
        .draggable-panel { 
            position: absolute; z-index: 5000; background: rgba(0,0,0,0.9); 
            border-radius: 10px; border: 2px solid #555; overflow: hidden;
            touch-action: none;
        }
        #offset-panel { top: 10px; left: 10px; padding: 5px; display: grid; grid-template-areas: "hd hd hd" ". up ." "left . right" ". down ."; gap: 5px; }
        .panel-header { grid-area: hd; background: #444; color: white; font-size: 11px; padding: 12px; text-align: center; cursor: move; font-weight: bold; border-radius: 4px; }
        .off-btn { width: 44px; height: 44px; background: #333; color: white; border: 1px solid #666; border-radius: 6px; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        #data-dashboard { top: 10px; right: 10px; min-width: 150px; }
        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 13px; pointer-events: none; }
        .dash-l1 { color: var(--hrc-red); font-weight: bold; }
        .dash-l2 { color: var(--hrc-blue); font-weight: bold; }
        .dash-gap { color: #0f0; border-top: 1px solid #333; margin-top: 5px; padding-top: 3px; text-align: right; }

        #controls { height: 95px; background: #1a1a1a; border-top: 1px solid #333; padding: 5px 10px; box-sizing: border-box; display: flex; flex-direction: column; }
        .ctrl-row { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 15px; border-radius: 4px; font-size: 12px; font-weight: bold; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        #lap-selector { display: flex; gap: 6px; overflow-x: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        
        .lap-btn { min-width: 85px; height: 42px; background: #2a2a2a; color: #ccc; border: 1px solid #555; border-radius: 6px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .lap-label-idx { font-weight: bold; font-size: 12px; }
        .lap-label-time { font-size: 11px; }
        
        .is-fastest .lap-label-idx { color: #FFA500 !important; }
        .is-best .lap-label-time { color: #FF0000 !important; font-weight: bold; }

        .lap-btn.primary { border: 2px solid var(--hrc-red); background: #331111; }
        .lap-btn.secondary { border: 2px solid var(--hrc-blue); background: #111133; }
        
        #seek-bar { width: 100%; height: 35px; margin: 0; touch-action: none; accent-color: #ff4444; }

        /* iOS対応：ファイル入力のラベル用スタイル */
        .file-label { position: relative; overflow: hidden; cursor: pointer; }
        .file-label input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map"></div>
    <div id="offset-panel" class="draggable-panel">
        <div class="panel-header" id="off-handle">✜ 補正</div>
        <button class="off-btn" style="grid-area:up" id="btn-up">↑</button>
        <button class="off-btn" style="grid-area:down" id="btn-down">↓</button>
        <button class="off-btn" style="grid-area:left" id="btn-left">←</button>
        <button class="off-btn" style="grid-area:right" id="btn-right">→</button>
    </div>
    <div id="chart-area">
        <div id="data-dashboard" class="draggable-panel">
            <div class="panel-header" id="dash-handle">✜ データ</div>
            <div id="dash-content">
                <div id="dash-time">Time: 0.00s</div>
                <div id="dash-l1-info" class="dash-l1">L1: ---</div>
                <div id="dash-l2-info" class="dash-l2">L2: ---</div>
                <div id="dash-gap-info" class="dash-gap">Gap: 0.000s</div>
            </div>
        </div>
        <div class="chart-box"><canvas id="telemetryChart"></canvas></div>
        <div id="delta-area" class="chart-box"><canvas id="deltaChart"></canvas></div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn">PLAY</button>
        
        <label class="mini-btn file-label">
            FILE
            <input type="file" id="fileInput" accept=".gpx">
        </label>

        <button class="mini-btn" onclick="location.reload()">RELOAD</button>
        <div id="lap-selector"></div>
    </div>
    <input type="range" id="seek-bar" value="0" min="0" step="1">
</div>

<script>
'use strict';
let map, marker1, marker2, telChart, deltaChart;
let lapDataStore = [], sessionMaxSpeed = 0, latOffset = 0, lonOffset = 0, isPlaying = false, currentFrame = 0;
let primaryIdx = -1, secondaryIdx = -1;

map = L.map('map', { zoomControl: false, maxZoom: 22 }).setView([35.68, 139.76], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);
marker1 = L.circleMarker([0,0], {color:'#000', fillColor:'#fff', radius:8, fillOpacity:1, weight:3});
marker2 = L.circleMarker([0,0], {color:'#000', fillColor:'#33ccff', radius:6, fillOpacity:1, weight:2});

function makeDraggable(el, handle) {
    let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    const dragStart = (e) => {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === handle) active = true;
    };
    const dragEnd = () => { initialX = currentX; initialY = currentY; active = false; };
    const drag = (e) => {
        if (active) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    };
    handle.addEventListener("touchstart", dragStart, {passive: false});
    handle.addEventListener("mousedown", dragStart);
    window.addEventListener("touchend", dragEnd);
    window.addEventListener("mouseup", dragEnd);
    window.addEventListener("touchmove", drag, {passive: false});
    window.addEventListener("mousemove", drag);
}
makeDraggable(document.getElementById('offset-panel'), document.getElementById('off-handle'));
makeDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));

const move = (la, lo) => { latOffset += la; lonOffset += lo; drawMapLines(); updateFrame(); };
document.getElementById('btn-up').onclick = () => move(0.000005, 0);
document.getElementById('btn-down').onclick = () => move(-0.000005, 0);
document.getElementById('btn-left').onclick = () => move(0, -0.000005);
document.getElementById('btn-right').onclick = () => move(0, 0.000005);

const playBtn = document.getElementById('playBtn'), seekBar = document.getElementById('seek-bar');
playBtn.onclick = () => { if (primaryIdx === -1) return; isPlaying = !isPlaying; playBtn.innerText = isPlaying ? "PAUSE" : "PLAY"; if (isPlaying) animate(); };

function animate() {
    if (!isPlaying) return;
    const p = lapDataStore[primaryIdx];
    if (currentFrame >= p.speeds.length - 1) { currentFrame = 0; isPlaying = false; playBtn.innerText = "PLAY"; }
    else { currentFrame++; seekBar.value = currentFrame; updateFrame(); requestAnimationFrame(animate); }
}
seekBar.oninput = () => { currentFrame = parseInt(seekBar.value); updateFrame(); };

function updateFrame() {
    if (primaryIdx === -1 || !lapDataStore[primaryIdx]) return;
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    const idx = Math.min(currentFrame, p.speeds.length - 1);
    marker1.setLatLng([p.coords[idx][0] + latOffset, p.coords[idx][1] + lonOffset]).addTo(map);
    let sIdx = 0;
    if (s) { sIdx = findIndexByDistance(s, p.dists[idx]); marker2.setLatLng([s.coords[sIdx][0] + latOffset, s.coords[sIdx][1] + lonOffset]).addTo(map); }
    document.getElementById('dash-time').innerText = `Time: ${p.times[idx].toFixed(2)}s`;
    document.getElementById('dash-l1-info').innerText = `L1: ${p.speeds[idx]}km/h / ${p.rpms[idx]}r`;
    if (s) {
        document.getElementById('dash-l2-info').innerText = `L2: ${s.speeds[sIdx]}km/h / ${s.rpms[sIdx]}r`;
        document.getElementById('dash-gap-info').innerText = `Gap: ${(s.times[sIdx] - p.times[idx]).toFixed(3)}s`;
        document.getElementById('dash-l2-info').style.display = 'block'; document.getElementById('dash-gap-info').style.display = 'block';
    } else {
        document.getElementById('dash-l2-info').style.display = 'none'; document.getElementById('dash-gap-info').style.display = 'none';
    }
    if(telChart) {
        const activeEls = [];
        telChart.data.datasets.forEach((ds, i) => { if(ds.display !== false) activeEls.push({datasetIndex: i, index: idx}); });
        telChart.setActiveElements(activeEls); telChart.update('none');
    }
    if(deltaChart) {
        deltaChart.setActiveElements([{datasetIndex: 0, index: idx}]); deltaChart.update('none');
    }
}

function findIndexByDistance(lap, d) {
    let l = 0, r = lap.dists.length - 1;
    while (l < r) { let m = (l + r) >> 1; if (lap.dists[m] < d) l = m + 1; else r = m; }
    return l;
}

// 修正：iPhone対応のファイル読み込み
document.getElementById('fileInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
        const xmlText = evt.target.result;
        if (!xmlText) return alert("ファイルが空です");
        parseGPX(new DOMParser().parseFromString(xmlText, "text/xml"));
    };
    reader.readAsText(file);
};

function parseGPX(xml) {
    const trks = xml.getElementsByTagName('trk'), selector = document.getElementById('lap-selector');
    selector.innerHTML = ''; lapDataStore = [];
    for (let i = 0; i < trks.length; i++) {
        const pts = trks[i].getElementsByTagName('trkpt'); if (pts.length < 2) continue;
        let speeds = [], rpms = [], coords = [], times = [], dists = [], dAcc = 0, lapMaxV = 0;
        const startT = pts[0].getElementsByTagName('time')[0] ? new Date(pts[0].getElementsByTagName('time')[0].textContent) : new Date();
        for (let j = 0; j < pts.length; j++) {
            const lat = parseFloat(pts[j].getAttribute('lat')), lon = parseFloat(pts[j].getAttribute('lon'));
            let sRaw = pts[j].getElementsByTagName('speed')[0]?.textContent || pts[j].getElementsByTagName('gpxtpx:speed')[0]?.textContent || 0;
            const s = Math.round(parseFloat(sRaw) * 3.6);
            if (j > 0) dAcc += L.latLng(coords[j-1]).distanceTo([lat, lon]);
            if (s > lapMaxV) lapMaxV = s;
            speeds.push(s); coords.push([lat, lon]);
            rpms.push(parseInt(pts[j].getElementsByTagName('gpxtpx:hr')[0]?.textContent || pts[j].getElementsByTagName('hr')[0]?.textContent || 0));
            times.push(pts[j].getElementsByTagName('time')[0] ? (new Date(pts[j].getElementsByTagName('time')[0].textContent) - startT) / 1000 : j);
            dists.push(dAcc);
        }
        lapDataStore.push({ speeds, rpms, coords, times, dists, duration: times[times.length-1], lapMaxV });
    }
    if (lapDataStore.length === 0) return alert("有効なラップが見つかりません");
    
    const bestIdx = lapDataStore.reduce((p, c, i, a) => c.duration < a[p].duration ? i : p, 0);
    const fastIdx = lapDataStore.reduce((p, c, i, a) => c.lapMaxV > a[p].lapMaxV ? i : p, 0);
    sessionMaxSpeed = lapDataStore[fastIdx].lapMaxV;

    lapDataStore.forEach((lap, i) => {
        const btn = document.createElement('button'); btn.className = 'lap-btn';
        if (i === bestIdx) btn.classList.add('is-best');
        if (i === fastIdx) btn.classList.add('is-fastest');
        btn.innerHTML = `<span class="lap-label-idx">L${i+1}</span><span class="lap-label-time">${lap.duration.toFixed(3)}s</span>`;
        btn.onclick = () => { 
            if (primaryIdx === -1 || (primaryIdx !== -1 && secondaryIdx !== -1)) { primaryIdx = i; secondaryIdx = -1; } 
            else if (i !== primaryIdx) { secondaryIdx = i; } 
            currentFrame = 0; updateUI(); 
        };
        selector.appendChild(btn);
    });
    primaryIdx = 0; updateUI(); map.setView(lapDataStore[0].coords[0], 17);
}

function updateUI() {
    document.querySelectorAll('.lap-btn').forEach((b, i) => { 
        b.classList.remove('primary', 'secondary');
        if (i === primaryIdx) b.classList.add('primary'); if (i === secondaryIdx) b.classList.add('secondary');
    });
    if (primaryIdx !== -1) { seekBar.max = lapDataStore[primaryIdx].speeds.length - 1; drawMapLines(); createCharts(); updateFrame(); }
}

function drawMapLines() {
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    if (window.p1) map.removeLayer(window.p1); if (window.p2) map.removeLayer(window.p2);
    const dl = (pts, spds, sec) => {
        const g = L.featureGroup();
        for (let i = 0; i < pts.length - 1; i++) {
            const c = `hsl(${(1 - Math.min(spds[i]/sessionMaxSpeed, 1)) * 240}, 100%, 50%)`;
            L.polyline([[pts[i][0]+latOffset, pts[i][1]+lonOffset], [pts[i+1][0]+latOffset, pts[i+1][1]+lonOffset]], {color:c, weight:sec?2:5, opacity:sec?0.3:1}).addTo(g);
        }
        return g;
    };
    window.p1 = dl(p.coords, p.speeds, false).addTo(map);
    if (s) window.p2 = dl(s.coords, s.speeds, true).addTo(map);
}

function createCharts() {
    const ctx1 = document.getElementById('telemetryChart').getContext('2d');
    const ctx2 = document.getElementById('deltaChart').getContext('2d');
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;

    // --- グラフの見た目設定 ---
    const config = {
        l1Speed: { color: '#ff4444', width: 3 },      // L1 速度: 鮮やかな赤 (太め)
        l1Rpm:   { color: 'rgba(255, 100, 100, 0.6)', width: 2 }, // L1 RPM: 少し薄い赤
        l2Speed: { color: '#33ccff', width: 3 },      // L2 速度: 鮮やかな青 (太め)
        l2Rpm:   { color: 'rgba(51, 204, 255, 0.6)', width: 2 }   // L2 RPM: 少し薄い青
    };

    const ds = [
        { 
            label: 'L1 Speed', 
            data: p.speeds, 
            borderColor: config.l1Speed.color, 
            borderWidth: config.l1Speed.width, 
            pointRadius: 0, 
            yAxisID: 'y' 
        },
        { 
            label: 'L1 RPM', 
            data: p.rpms, 
            borderColor: config.l1Rpm.color, 
            borderWidth: config.l1Rpm.width, 
            pointRadius: 0, 
            yAxisID: 'yRPM',
            fill: false
        }
    ];

    if (s) {
        ds.push({ 
            label: 'L2 Speed', 
            data: p.dists.map(d => s.speeds[findIndexByDistance(s, d)]), 
            borderColor: config.l2Speed.color, 
            borderWidth: config.l2Speed.width, 
            borderDash: [8, 4], // 大きめの点線で差別化
            pointRadius: 0,
            yAxisID: 'y'
        });
        ds.push({ 
            label: 'L2 RPM', 
            data: p.dists.map(d => s.rpms[findIndexByDistance(s, d)]), 
            borderColor: config.l2Rpm.color, 
            borderWidth: config.l2Rpm.width, 
            borderDash: [4, 2], // 細かい点線
            pointRadius: 0, 
            yAxisID: 'yRPM'
        });
    }

    if (telChart) telChart.destroy();
    telChart = new Chart(ctx1, {
        type: 'line',
        data: { labels: p.times.map(t => t.toFixed(2)), datasets: ds },
        options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            animation: false, 
            plugins: { legend: { display: false } }, 
            scales: { 
                x: { display: false }, 
                y: { 
                    min: 0,
                    grid: { color: '#333' }, // グリッド線を少し見えるように
                    title: { display: true, text: 'Km/h', color: '#eee' } 
                },
                yRPM: { 
                    position: 'right', 
                    min: 0, 
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: 'RPM', color: '#eee' }
                } 
            } 
        }
    });

    if (deltaChart) deltaChart.destroy();
    if (s) {
        const dd = p.dists.map((d, i) => s.times[findIndexByDistance(s, d)] - p.times[i]);
        deltaChart = new Chart(ctx2, {
            type: 'line', 
            data: { 
                labels: p.times.map(t => t.toFixed(2)), 
                datasets: [{ 
                    data: dd, 
                    borderColor: '#0f0', 
                    borderWidth: 2,
                    fill: true, 
                    backgroundColor: 'rgba(0,255,0,0.15)', 
                    pointRadius: 0 
                }] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                animation: false, 
                plugins: { legend: { display: false } }, 
                scales: { 
                    x: { display: false },
                    y: { grid: { color: '#333' } }
                } 
            }
        });
    }
}
</script>
</body>
</html>

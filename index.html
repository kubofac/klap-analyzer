<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP ANALYZER V7.0.1</title>
         <link rel="manifest" href="/manifest.json">  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --bg-dark: #0a0a0a; }
        html, body { overflow: hidden; position: fixed; width: 100%; height: 100%; touch-action: none !important; background: #000; }
        #main-container { display: flex; height: calc(100dvh - 105px); position: relative; width: 100%; }
        #map { width: 45%; height: 100%; border-right: 1px solid var(--hrc-red); background: #222; }
        #chart-area { width: 55%; height: 100%; background: #111; display: flex; flex-direction: column; position: relative; }
        .chart-box { flex: 1; padding: 5px; box-sizing: border-box; min-height: 0; }
        #delta-area { height: 80px; border-top: 1px solid #444; background: #000; }
        .draggable-panel { position: absolute; z-index: 5000; background: rgba(0,0,0,0.9); border-radius: 10px; border: 2px solid #555; overflow: hidden; touch-action: none; }
        #offset-panel { top: 10px; left: 10px; padding: 5px; display: grid; grid-template-areas: "hd hd hd" ". up ." "left . right" ". down ."; gap: 5px; }
        .panel-header { grid-area: hd; background: #444; color: white; font-size: 11px; padding: 8px; text-align: center; cursor: move; font-weight: bold; }
        .off-btn { width: 35px; height: 35px; background: #333; color: white; border: 1px solid #666; border-radius: 6px; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        #data-dashboard { top: 10px; right: 10px; min-width: 155px; }
        #dash-content { padding: 8px; font-family: 'Courier New', monospace; font-size: 11px; pointer-events: none; }
        .dash-l1 { color: var(--hrc-red); font-weight: bold; }
        .dash-l2 { color: var(--hrc-blue); font-weight: bold; }
        .dash-gap { color: #0f0; border-top: 1px solid #333; margin-top: 4px; padding-top: 2px; text-align: right; }
        .dash-sector { color: #ffff00; border-top: 1px dashed #555; margin-top: 4px; padding-top: 4px; font-size: 10px; }
        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #1a1a1a; border-top: 1px solid #333; padding: 5px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 9999; }
        .ctrl-row { display: flex; align-items: center; gap: 4px; flex: 1; overflow-x: auto; width: 100%; white-space: nowrap; padding-bottom: 2px; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 10px; border-radius: 4px; font-size: 10px; font-weight: bold; height: 38px; flex-shrink: 0; }
        .btn-set { background: #555; color: #fff; min-width: 45px; }
        .btn-set.active { background: var(--hrc-red); box-shadow: 0 0 5px var(--hrc-red); }
        #lap-selector { display: flex; gap: 4px; flex-shrink: 0; }
        .lap-btn { min-width: 75px; height: 38px; background: #2a2a2a; color: #ccc; border: 1px solid #555; border-radius: 4px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .lap-btn.primary { border: 2px solid var(--hrc-red); background: #331111; }
        .lap-btn.secondary { border: 2px solid var(--hrc-blue); background: #111133; }
        #seek-bar { width: 100%; height: 40px; margin: 0; accent-color: #ff4444; -webkit-appearance: none; background: transparent; }
        #seek-bar::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #444; border-radius: 3px; }
        #seek-bar::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: var(--hrc-red); margin-top: -10px; border: 2px solid #fff; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map"></div>
    <div id="offset-panel" class="draggable-panel">
        <div class="panel-header" id="off-handle">✜ 補正</div>
        <button class="off-btn" style="grid-area:up" id="btn-up">↑</button>
        <button class="off-btn" style="grid-area:down" id="btn-down">↓</button>
        <button class="off-btn" style="grid-area:left" id="btn-left">←</button>
        <button class="off-btn" style="grid-area:right" id="btn-right">→</button>
    </div>
    <div id="chart-area">
        <div id="data-dashboard" class="draggable-panel">
            <div class="panel-header" id="dash-handle">✜ データ</div>
            <div id="dash-content">
                <div id="dash-time">Time: 0.00s</div>
                <div id="dash-l1-info" class="dash-l1">L1: ---</div>
                <div id="dash-l2-info" class="dash-l2">L2: ---</div>
                <div id="dash-gap-info" class="dash-gap">Gap: 0.000s</div>
                <div id="dash-sector-info" class="dash-sector">Sector A-B:<br>---</div>
            </div>
        </div>
        <div class="chart-box"><canvas id="telemetryChart"></canvas></div>
        <div id="delta-area" class="chart-box"><canvas id="deltaChart"></canvas></div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">FILE</button>
        <button class="mini-btn btn-set" id="btn-setA">SET A</button>
        <button class="mini-btn btn-set" id="btn-setB">SET B</button>
        <div id="lap-selector"></div>
        <button class="mini-btn" onclick="location.reload()" style="background:#222">RELOAD</button>
    </div>
    <input type="range" id="seek-bar" value="0" min="0" step="1">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<script>
'use strict';
let map, marker1, marker2, telChart, deltaChart;
let lapDataStore = [], sessionMaxSpeed = 0, latOffset = 0, lonOffset = 0, isPlaying = false, currentFrame = 0;
let primaryIdx = -1, secondaryIdx = -1, distA = null, distB = null;

// Leaflet初期化
map = L.map('map', { zoomControl: false, maxZoom: 22 }).setView([35.68, 139.76], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);
marker1 = L.circleMarker([0,0], {color:'#fff', fillColor:'#ff4444', radius:8, fillOpacity:1, weight:2});
marker2 = L.circleMarker([0,0], {color:'#fff', fillColor:'#33ccff', radius:6, fillOpacity:1, weight:2});

// ドラッグ機能
function makeDraggable(el, handle) {
    let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    const dragStart = (e) => {
        initialX = (e.type === "touchstart" ? e.touches[0].clientX : e.clientX) - xOffset;
        initialY = (e.type === "touchstart" ? e.touches[0].clientY : e.clientY) - yOffset;
        if (e.target === handle) active = true;
    };
    const dragEnd = () => { initialX = currentX; initialY = currentY; active = false; };
    const drag = (e) => {
        if (active) {
            e.preventDefault();
            currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
            currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;
            xOffset = currentX; yOffset = currentY;
            el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
        }
    };
    handle.addEventListener("touchstart", dragStart, {passive: false});
    handle.addEventListener("mousedown", dragStart);
    window.addEventListener("touchend", dragEnd);
    window.addEventListener("mouseup", dragEnd);
    window.addEventListener("touchmove", drag, {passive: false});
    window.addEventListener("mousemove", drag);
}
makeDraggable(document.getElementById('offset-panel'), document.getElementById('off-handle'));
makeDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));

// 再生機能
const playBtn = document.getElementById('playBtn');
playBtn.onclick = () => {
    if (primaryIdx === -1) return;
    isPlaying = !isPlaying;
    playBtn.innerText = isPlaying ? "PAUSE" : "PLAY";
    if (isPlaying) animate();
};

function animate() {
    if (!isPlaying) return;
    const p = lapDataStore[primaryIdx];
    if (currentFrame >= p.speeds.length - 1) {
        currentFrame = 0; isPlaying = false; playBtn.innerText = "PLAY";
    } else {
        currentFrame++; 
        document.getElementById('seek-bar').value = currentFrame; 
        updateFrame(); 
        requestAnimationFrame(animate);
    }
}

// 補正
const move = (la, lo) => { latOffset += la; lonOffset += lo; drawMapLines(); updateFrame(); };
document.getElementById('btn-up').onclick = () => move(0.000005, 0);
document.getElementById('btn-down').onclick = () => move(-0.000005, 0);
document.getElementById('btn-left').onclick = () => move(0, -0.000005);
document.getElementById('btn-right').onclick = () => move(0, 0.000005);

// セクター
document.getElementById('btn-setA').onclick = function() {
    if (primaryIdx === -1) return;
    distA = lapDataStore[primaryIdx].dists[currentFrame];
    document.querySelectorAll('.btn-set').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    calculateSectors();
};
document.getElementById('btn-setB').onclick = function() {
    if (primaryIdx === -1) return;
    distB = lapDataStore[primaryIdx].dists[currentFrame];
    this.classList.add('active');
    calculateSectors();
};

function calculateSectors() {
    if (distA === null || distB === null) return;
    const getT = (lap) => {
        const d1 = Math.min(distA, distB), d2 = Math.max(distA, distB);
        const i1 = lap.dists.findIndex(d => d >= d1), i2 = lap.dists.findIndex(d => d >= d2);
        return lap.times[i2] - lap.times[i1];
    };
    const t1 = getT(lapDataStore[primaryIdx]);
    let html = `L1: ${t1.toFixed(3)}s`;
    if (secondaryIdx !== -1) {
        const t2 = getT(lapDataStore[secondaryIdx]);
        const diff = t1 - t2;
        html += `<br>L2: ${t2.toFixed(3)}s (${diff > 0 ? '+' : ''}${diff.toFixed(3)}s)`;
    }
    document.getElementById('dash-sector-info').innerHTML = `Sector A-B:<br>${html}`;
}

const seekBar = document.getElementById('seek-bar');
document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
seekBar.oninput = () => { currentFrame = parseInt(seekBar.value); isPlaying = false; playBtn.innerText = "PLAY"; updateFrame(); };

function updateFrame() {
    if (primaryIdx === -1 || !lapDataStore[primaryIdx]) return;
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    const idx = Math.min(currentFrame, p.speeds.length - 1);
    marker1.setLatLng([p.coords[idx][0] + latOffset, p.coords[idx][1] + lonOffset]).addTo(map);
    let sIdx = 0;
    if (s) { 
        sIdx = findIndexByDistance(s, p.dists[idx]); 
        marker2.setLatLng([s.coords[sIdx][0] + latOffset, s.coords[sIdx][1] + lonOffset]).addTo(map); 
    }
    document.getElementById('dash-time').innerText = `Time: ${p.times[idx].toFixed(2)}s`;
    document.getElementById('dash-l1-info').innerText = `L1: ${p.speeds[idx]}km/h / ${p.rpms[idx]}r`;
    if (s) {
        document.getElementById('dash-l2-info').innerText = `L2: ${s.speeds[sIdx]}km/h / ${s.rpms[sIdx]}r`;
        document.getElementById('dash-gap-info').innerText = `Gap: ${(s.times[sIdx] - p.times[idx]).toFixed(3)}s`;
        document.getElementById('dash-l2-info').style.display = 'block';
        document.getElementById('dash-gap-info').style.display = 'block';
    } else {
        document.getElementById('dash-l2-info').style.display = 'none';
        document.getElementById('dash-gap-info').style.display = 'none';
    }
    [telChart, deltaChart].forEach(chart => {
        if (chart && chart.options.plugins.annotation) {
            chart.options.plugins.annotation.annotations.line1.xMin = idx;
            chart.options.plugins.annotation.annotations.line1.xMax = idx;
            chart.update('none');
        }
    });
}

function findIndexByDistance(lap, d) {
    let l = 0, r = lap.dists.length - 1;
    while (l < r) { let m = (l + r) >> 1; if (lap.dists[m] < d) l = m + 1; else r = m; }
    return l;
}

document.getElementById('fileInput').onchange = e => {
    const reader = new FileReader();
    reader.onload = evt => parseGPX(new DOMParser().parseFromString(evt.target.result, "text/xml"));
    reader.readAsText(e.target.files[0]);
};

function parseGPX(xml) {
    const trks = xml.getElementsByTagName('trk'), selector = document.getElementById('lap-selector');
    selector.innerHTML = ''; lapDataStore = [];
    for (let i = 0; i < trks.length; i++) {
        const pts = trks[i].getElementsByTagName('trkpt'); if (pts.length < 2) continue;
        let speeds = [], rpms = [], coords = [], times = [], dists = [], dAcc = 0, lapMaxV = 0;
        const startT = pts[0].getElementsByTagName('time')[0] ? new Date(pts[0].getElementsByTagName('time')[0].textContent) : new Date();
        for (let j = 0; j < pts.length; j++) {
            const lat = parseFloat(pts[j].getAttribute('lat')), lon = parseFloat(pts[j].getAttribute('lon'));
            let sRaw = pts[j].getElementsByTagName('speed')[0]?.textContent || pts[j].getElementsByTagName('gpxtpx:speed')[0]?.textContent || 0;
            const s = Math.round(parseFloat(sRaw) * 3.6);
            if (j > 0) dAcc += L.latLng(coords[j-1]).distanceTo([lat, lon]);
            if (s > lapMaxV) lapMaxV = s;
            speeds.push(s); coords.push([lat, lon]);
            rpms.push(parseInt(pts[j].getElementsByTagName('gpxtpx:hr')[0]?.textContent || pts[j].getElementsByTagName('hr')[0]?.textContent || 0));
            times.push(pts[j].getElementsByTagName('time')[0] ? (new Date(pts[j].getElementsByTagName('time')[0].textContent) - startT) / 1000 : j);
            dists.push(dAcc);
        }
        lapDataStore.push({ speeds, rpms, coords, times, dists, duration: times[times.length-1], lapMaxV });
    }
    if (lapDataStore.length === 0) return;
    lapDataStore.forEach((lap, i) => {
        const btn = document.createElement('button'); btn.className = 'lap-btn';
        btn.innerHTML = `<span class="lap-label-idx">L${i+1}</span><span class="lap-label-time">${lap.duration.toFixed(3)}s</span>`;
        btn.onclick = () => { 
            if (primaryIdx === -1 || (primaryIdx !== -1 && secondaryIdx !== -1)) { primaryIdx = i; secondaryIdx = -1; distA = distB = null; } 
            else if (i !== primaryIdx) { secondaryIdx = i; } 
            currentFrame = 0; updateUI(); 
        };
        selector.appendChild(btn);
    });
    primaryIdx = 0; updateUI(); map.setView(lapDataStore[0].coords[0], 17);
}

function updateUI() {
    document.querySelectorAll('.lap-btn').forEach((b, i) => { 
        b.classList.remove('primary', 'secondary');
        if (i === primaryIdx) b.classList.add('primary'); if (i === secondaryIdx) b.classList.add('secondary');
    });
    if (primaryIdx !== -1) { 
        seekBar.max = lapDataStore[primaryIdx].speeds.length - 1; 
        drawMapLines(); createCharts(); updateFrame(); calculateSectors();
    }
}

function drawMapLines() {
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    if (window.p1) map.removeLayer(window.p1); if (window.p2) map.removeLayer(window.p2);
    const dl = (pts, spds, sec) => {
        const g = L.featureGroup();
        const maxV = Math.max(...spds, 100);
        for (let i = 0; i < pts.length - 1; i++) {
            const c = `hsl(${(1 - Math.min(spds[i]/maxV, 1)) * 240}, 100%, 50%)`;
            L.polyline([[pts[i][0]+latOffset, pts[i][1]+lonOffset], [pts[i+1][0]+latOffset, pts[i+1][1]+lonOffset]], {color:c, weight:sec?2:5, opacity:sec?0.3:1}).addTo(g);
        }
        return g;
    };
    window.p1 = dl(p.coords, p.speeds, false).addTo(map);
    if (s) window.p2 = dl(s.coords, s.speeds, true).addTo(map);
}

function createCharts() {
    const ctx1 = document.getElementById('telemetryChart').getContext('2d');
    const ctx2 = document.getElementById('deltaChart').getContext('2d');
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    const ds = [{ label: 'Speed (L1)', data: p.speeds, borderColor: '#ff4444', borderWidth: 2, pointRadius: 0, yAxisID: 'y' },
                { label: 'RPM (L1)', data: p.rpms, borderColor: '#ffff00', borderWidth: 1, pointRadius: 0, yAxisID: 'yRPM' }];
    if (s) ds.push({ label: 'Speed (L2)', data: p.dists.map(d => s.speeds[findIndexByDistance(s, d)]), borderColor: '#33ccff', borderWidth: 1, borderDash: [5,5], pointRadius: 0, yAxisID: 'y' });
    if (telChart) telChart.destroy();
    telChart = new Chart(ctx1, {
        type: 'line', data: { labels: p.times.map(t => t.toFixed(2)), datasets: ds },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, annotation: { annotations: { line1: { type: 'line', xMin: 0, xMax: 0, borderColor: '#fff', borderWidth: 1 } } } },
            scales: { x: { display: false }, y: { min: 0, ticks: { color: '#ff4444' } }, yRPM: { min: 0, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#ffff00' } } } }
    });
    if (deltaChart) deltaChart.destroy();
    if (s) {
        const dd = p.dists.map((d, i) => s.times[findIndexByDistance(s, d)] - p.times[i]);
        deltaChart = new Chart(ctx2, {
            type: 'line', data: { labels: p.times.map(t => t.toFixed(2)), datasets: [{ data: dd, borderColor: '#0f0', fill: true, backgroundColor: 'rgba(0,255,0,0.1)', pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, annotation: { annotations: { line1: { type: 'line', xMin: 0, xMax: 0, borderColor: '#fff', borderWidth: 1 } } } },
                scales: { x: { display: false }, y: { ticks: { color: '#0f0' }, grid: { color: '#333' } } } }
        });
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP ANALYZER V11.8.5</title>
     <link rel="manifest" href="/manifest.json">  
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --hrc-green: #00ff00; --hrc-orange: #ff9900; }
        html, body { overflow: hidden; width: 100%; height: 100%; background: #000; margin: 0; padding: 0; font-family: sans-serif; color: #fff; }
        #main-container { display: flex; height: calc(100vh - 105px); width: 100%; }
        #map { width: 35%; height: 100%; border-right: 1px solid #444; background: #222; position: relative; }
        #chart-area { width: 65%; height: 100%; background: #000; position: relative; }
        
        /* グラフエリアを縦いっぱい（100%）に */
        .chart-full-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Dashboard (比較用) */
        .draggable-panel { position: absolute; z-index: 5000; background: rgba(0,0,0,0.9); border-radius: 8px; border: 1.5px solid #666; width: 260px; pointer-events: auto; }
        .panel-header { background: #333; color: white; font-size: 11px; padding: 6px; text-align: center; cursor: move; }
        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 11px; }
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; text-align: right; margin-bottom: 4px; }
        .grid-label { text-align: left; color: #aaa; }
        
        /* ラップリスト */
        #lap-list-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #lap-list-content { overflow-y: auto; margin-top: 15px; }
        .lap-row { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid #333; cursor: pointer; text-align: center; font-size: 12px; }
        .lap-row.sel-p { background: rgba(51, 204, 255, 0.25); outline: 1px solid var(--hrc-blue); }
        .lap-row.sel-s { background: rgba(255, 68, 68, 0.25); outline: 1px solid var(--hrc-red); }
        .lap-row span { flex: 1; }

        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #111; z-index: 999; padding: 5px; box-sizing: border-box; }
        .ctrl-row { display: flex; align-items: center; gap: 6px; height: 45px; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 15px; border-radius: 4px; font-size: 12px; height: 35px; cursor: pointer; font-weight: bold; }
        #seek-bar { width: 100%; height: 40px; accent-color: var(--hrc-red); }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map"></div>
    <div id="chart-area">
        <div id="data-dashboard" class="draggable-panel" style="top:10px; right:10px;">
            <div class="panel-header" id="dash-handle">ANALYSIS DASHBOARD</div>
            <div id="dash-content">
                <div class="dash-grid" style="font-weight:bold; border-bottom:1px solid #444; padding-bottom:3px;">
                    <span class="grid-label">ITEM</span><span style="color:var(--hrc-blue)">BLUE</span><span style="color:var(--hrc-red)">RED</span>
                </div>
                <div class="dash-grid"><span class="grid-label">LAP</span><span id="p-lap-id">-</span><span id="s-lap-id">-</span></div>
                <div class="dash-grid"><span class="grid-label">SPD</span><span id="p-spd">-</span><span id="s-spd">-</span></div>
                <div class="dash-grid"><span class="grid-label">RPM</span><span id="p-rpm">-</span><span id="s-rpm">-</span></div>
                <hr style="border:0; border-top:1px solid #333;">
                <div class="dash-grid"><span class="grid-label">S1</span><span id="p-s1">-</span><span id="s-s1">-</span></div>
                <div class="dash-grid"><span class="grid-label">S2</span><span id="p-s2">-</span><span id="s-s2">-</span></div>
                <div class="dash-grid"><span class="grid-label">S3</span><span id="p-s3">-</span><span id="s-s3">-</span></div>
                <div class="dash-grid"><span class="grid-label">S4</span><span id="p-s4">-</span><span id="s-s4">-</span></div>
                <div class="dash-grid" style="margin-top:5px; padding-top:5px; border-top:1px solid #444;">
                    <span class="grid-label" style="color:var(--hrc-green)">DIFF</span><span id="delta-val" style="grid-column: span 2; color:var(--hrc-green); font-weight:bold;">0.000s</span>
                </div>
            </div>
        </div>
        <div class="chart-full-container">
            <canvas id="mainChart"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">FILE OPEN</button>
        <button class="mini-btn" id="openListBtn" style="background:var(--hrc-blue)">SELECT LAPS</button>
        <button class="mini-btn" onclick="location.reload()" style="background:#333">RESET</button>
    </div>
    <input type="range" id="seek-bar" value="0" min="0" step="1">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<div id="lap-list-overlay">
    <h3 style="text-align:center;">Select 1 or 2 Laps</h3>
    <div id="lap-list-content"></div>
    <button class="mini-btn" style="margin-top:20px; width:100%; height:50px; background:var(--hrc-blue)" onclick="closeLapList()">OK / CLOSE</button>
</div>

<script>
'use strict';
let map, markerP, markerS, mainChart, lapDataStore = [], currentFrame = 0, isPlaying = false;
let primaryIdx = null, secondaryIdx = null, autoLines = {};

window.onload = () => {
    map = L.map('map', { zoomControl: false, maxZoom: 22 }).setView([35.68, 139.76], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);
    markerP = L.circleMarker([0,0], {color:'#33ccff', fillColor:'#000', radius:7, fillOpacity:1, weight:3}).addTo(map);
    markerS = L.circleMarker([0,0], {color:'#ff4444', fillColor:'#000', radius:7, fillOpacity:1, weight:3}).addTo(map);
    initDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));
};

function initDraggable(el, handle) {
    let p1=0, p2=0, p3=0, p4=0;
    handle.onmousedown = (e) => { e.preventDefault(); p3=e.clientX; p4=e.clientY; document.onmouseup=dragEnd; document.onmousemove=dragMove; };
    function dragMove(e) { p1=p3-e.clientX; p2=p4-e.clientY; p3=e.clientX; p4=e.clientY; el.style.top=(el.offsetTop-p2)+"px"; el.style.left=(el.offsetLeft-p1)+"px"; }
    function dragEnd(){ document.onmouseup=null; document.onmousemove=null; }
}

document.getElementById('fileBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
    const reader = new FileReader();
    reader.onload = evt => {
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");
        parseLineData(xml); processGlobalGPX(xml);
    };
    reader.readAsText(e.target.files[0]);
};

function parseLineData(xml) {
    autoLines = {};
    const desc = xml.getElementsByTagName('desc')[0]?.textContent;
    if (desc?.includes('LINE_DATA[')) {
        const match = desc.match(/LINE_DATA\[(.*?)\]/);
        if (match) match[1].split('|').forEach(item => {
            const [k, v] = item.split(':');
            if (v && v!=="SKIP") { const c=v.split(',').map(Number); autoLines[k]={p1:{lat:c[0],lon:c[1]}, p2:{lat:c[2],lon:c[3]}}; }
        });
    }
}

function processGlobalGPX(xml) {
    const pts = xml.getElementsByTagName('trkpt');
    let allPoints = [];
    for (let i = 0; i < pts.length; i++) {
        const lat = parseFloat(pts[i].getAttribute('lat')), lon = parseFloat(pts[i].getAttribute('lon'));
        const time = new Date(pts[i].getElementsByTagName('time')[0].textContent).getTime();
        let rpm = 0;
        const ext = pts[i].getElementsByTagName('extensions')[0];
        if(ext) {
            const rpmTag = ext.getElementsByTagName('rpm')[0] || ext.getElementsByTagName('ns3:rpm')[0];
            rpm = parseInt(rpmTag?.textContent || 0);
        }
        allPoints.push({ lat, lon, time, rpm });
    }
    lapDataStore = [];
    let cur = { coords:[], times:[], rpms:[], speeds:[], rawTimes:[] }, lastSL = 0;
    for (let i = 0; i < allPoints.length; i++) {
        const p = allPoints[i];
        cur.coords.push([p.lat, p.lon]); cur.rpms.push(p.rpm); cur.rawTimes.push(p.time);
        if (cur.coords.length > 1) {
            const d = L.latLng(cur.coords[cur.coords.length-2]).distanceTo([p.lat, p.lon]);
            const dt = (p.time - cur.rawTimes[cur.rawTimes.length-2]) / 1000;
            cur.speeds.push(dt > 0 ? (d/dt)*3.6 : 0);
        } else cur.speeds.push(0);

        if (i > 0 && autoLines.SL && getIntersect(allPoints[i-1], p, autoLines.SL)) {
            if (p.time - lastSL > 10000) {
                cur.times = cur.rawTimes.map(t => (t - cur.rawTimes[0]) / 1000);
                cur.duration = p.time - (lastSL || allPoints[0].time);
                lapDataStore.push(cur);
                cur = { coords:[[p.lat, p.lon]], times:[], rpms:[p.rpm], speeds:[0], rawTimes:[p.time] };
                lastSL = p.time;
            }
        }
    }
    primaryIdx = lapDataStore.length > 1 ? 1 : 0;
    renderLapList(); updateUI();
}

function getIntersect(p1, p2, line) {
    const x1=p1.lon, y1=p1.lat, x2=p2.lon, y2=p2.lat, x3=line.p1.lon, y3=line.p1.lat, x4=line.p2.lon, y4=line.p2.lat;
    const den = (y4-y3)*(x2-x1)-(x4-x3)*(y2-y1);
    if (den === 0) return false;
    const ua = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/den, ub = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/den;
    return (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1);
}

function calculateSectors(lap) {
    let s1=null, s2=null, s3=null;
    for (let j = 1; j < lap.coords.length; j++) {
        const p1 = {lat: lap.coords[j-1][0], lon: lap.coords[j-1][1]}, p2 = {lat: lap.coords[j][0], lon: lap.coords[j][1]};
        if (!s1 && autoLines.S1 && getIntersect(p1, p2, autoLines.S1)) s1 = lap.times[j];
        if (!s2 && autoLines.S2 && getIntersect(p1, p2, autoLines.S2)) s2 = lap.times[j];
        if (!s3 && autoLines.S3 && getIntersect(p1, p2, autoLines.S3)) s3 = lap.times[j];
    }
    const lastT = s3 || s2 || s1;
    return {
        s1: s1 ? s1.toFixed(3) : "--",
        s2: (s1 && s2) ? (s2-s1).toFixed(3) : "--",
        s3: (s2 && s3) ? (s3-s2).toFixed(3) : "--",
        s4: lastT ? ((lap.duration/1000) - lastT).toFixed(3) : "--"
    };
}

function renderLapList() {
    const container = document.getElementById('lap-list-content');
    container.innerHTML = `<div class="lap-row" style="font-weight:bold; background:#222;"><span>LAP</span><span>S1</span><span>S2</span><span>S3</span><span>S4</span><span>TOTAL</span></div>`;
    lapDataStore.forEach((lap, i) => {
        let s = calculateSectors(lap);
        const div = document.createElement('div');
        div.className = `lap-row ${primaryIdx===i?'sel-p':''} ${secondaryIdx===i?'sel-s':''}`;
        div.innerHTML = `<span>L${i}</span><span>${s.s1}</span><span>${s.s2}</span><span>${s.s3}</span><span>${s.s4}</span><span style="color:var(--hrc-red)">${(lap.duration/1000).toFixed(3)}s</span>`;
        div.onclick = () => {
            if(primaryIdx===i) primaryIdx=null;
            else if(secondaryIdx===i) secondaryIdx=null;
            else if(primaryIdx===null) primaryIdx=i;
            else secondaryIdx=i;
            renderLapList();
        };
        container.appendChild(div);
    });
}

function closeLapList() { document.getElementById('lap-list-overlay').style.display='none'; currentFrame=0; updateUI(); }

function updateUI() {
    const p = lapDataStore[primaryIdx]; if(!p) return;
    document.getElementById('seek-bar').max = p.speeds.length - 1;
    if (window.pathLayer) map.removeLayer(window.pathLayer);
    const g = L.featureGroup();
    L.polyline(p.coords, { color: '#33ccff', weight: 4 }).addTo(g);
    if(secondaryIdx !== null) L.polyline(lapDataStore[secondaryIdx].coords, { color: '#ff4444', weight: 2, dashArray: '5,5' }).addTo(g);
    Object.keys(autoLines).forEach(key => {
        const line = autoLines[key];
        L.polyline([[line.p1.lat, line.p1.lon], [line.p2.lat, line.p2.lon]], { color: key==='SL'?'#fff':'#ff0', weight: 2 }).addTo(g);
    });
    window.pathLayer = g.addTo(map);
    map.fitBounds(g.getBounds());
    createCharts(); updateFrame();
}

function createCharts() {
    const p = lapDataStore[primaryIdx];
    const ctxM = document.getElementById('mainChart').getContext('2d');
    if (mainChart) mainChart.destroy();

    const datasets = [
        { label:'SPD P', data:p.speeds, borderColor:'#33ccff', pointRadius:0, yAxisID:'y', borderWidth:3 },
        { label:'RPM P', data:p.rpms, borderColor:'rgba(0,255,0,0.6)', pointRadius:0, yAxisID:'y1', borderDash:[2,2] }
    ];

    if (secondaryIdx !== null) {
        const s = lapDataStore[secondaryIdx];
        datasets.push({ label:'SPD S', data:s.speeds, borderColor:'#ff4444', pointRadius:0, yAxisID:'y', borderWidth:3 });
        datasets.push({ label:'RPM S', data:s.rpms, borderColor:'rgba(255,165,0,0.6)', pointRadius:0, yAxisID:'y1', borderDash:[2,2] });
    }

    mainChart = new Chart(ctxM, {
        type: 'line', data: { labels: p.times.map((_,i)=>i), datasets },
        options: { responsive:true, maintainAspectRatio:false, animation:false, scales: { x:{display:false}, y:{position:'left', title:{display:true,text:'SPD(km/h)'}}, y1:{position:'right', grid:{display:false}, title:{display:true,text:'RPM'}} }, plugins: { legend:{display:false}, annotation:{annotations:{now:{type:'line', xMin:0, xMax:0, borderColor:'#fff', borderWidth:2}}} } }
    });
}

function updateFrame() {
    const p = lapDataStore[primaryIdx]; if(!p) return;
    const idx = Math.min(currentFrame, p.speeds.length-1);
    markerP.setLatLng(p.coords[idx]);
    
    const pS = calculateSectors(p);
    document.getElementById('p-lap-id').innerText = primaryIdx;
    document.getElementById('p-spd').innerText = Math.round(p.speeds[idx]);
    document.getElementById('p-rpm').innerText = p.rpms[idx];
    document.getElementById('p-s1').innerText = pS.s1; document.getElementById('p-s2').innerText = pS.s2;
    document.getElementById('p-s3').innerText = pS.s3; document.getElementById('p-s4').innerText = pS.s4;

    if (secondaryIdx !== null) {
        const s = lapDataStore[secondaryIdx];
        const sIdx = Math.min(currentFrame, s.speeds.length-1);
        markerS.setLatLng(s.coords[sIdx]);
        const sS = calculateSectors(s);
        document.getElementById('s-lap-id').innerText = secondaryIdx;
        document.getElementById('s-spd').innerText = Math.round(s.speeds[sIdx]);
        document.getElementById('s-rpm').innerText = s.rpms[sIdx];
        document.getElementById('s-s1').innerText = sS.s1; document.getElementById('s-s2').innerText = sS.s2;
        document.getElementById('s-s3').innerText = sS.s3; document.getElementById('s-s4').innerText = sS.s4;
        document.getElementById('delta-val').innerText = (p.times[idx] - s.times[sIdx]).toFixed(3) + "s";
    } else {
        document.getElementById('s-lap-id').innerText = "-";
        document.getElementById('s-spd').innerText = "-";
        document.getElementById('s-rpm').innerText = "-";
        document.getElementById('delta-val').innerText = "0.000s";
    }

    if(mainChart) {
        mainChart.options.plugins.annotation.annotations.now.xMin = idx;
        mainChart.options.plugins.annotation.annotations.now.xMax = idx;
        mainChart.update('none');
    }
}

document.getElementById('openListBtn').onclick = () => document.getElementById('lap-list-overlay').style.display='flex';
document.getElementById('seek-bar').oninput = () => { currentFrame = parseInt(document.getElementById('seek-bar').value); updateFrame(); };
document.getElementById('playBtn').onclick = function() { isPlaying = !isPlaying; this.innerText = isPlaying ? "PAUSE" : "PLAY"; if(isPlaying) animate(); };
function animate() { if(!isPlaying) return; if(currentFrame >= lapDataStore[primaryIdx].speeds.length-1) { isPlaying=false; document.getElementById('playBtn').innerText="PLAY"; return; } currentFrame++; document.getElementById('seek-bar').value = currentFrame; updateFrame(); requestAnimationFrame(animate); }
</script>
</body>
</html>

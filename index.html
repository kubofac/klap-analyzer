<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP ANALYZER V7.7.8</title>
    <link rel="manifest" href="/manifest.json">  
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --hrc-red: #ff4444; --hrc-blue: #33ccff; --hrc-green: #00ff00; --bg-dark: #0a0a0a; --sec-yellow: #ffff00; }
        html, body { overflow: hidden; position: fixed; width: 100%; height: 100%; background: #000; margin: 0; padding: 0; }
        #main-container { display: flex; height: calc(100vh - 105px); width: 100%; }
        #map { width: 45%; height: 100%; border-right: 1px solid var(--hrc-red); background: #222; z-index: 1; }
        
        #chart-area { width: 55%; height: 100%; background: #111; display: flex; flex-direction: column; position: relative; }
        .chart-container-top { flex: 4; position: relative; padding: 5px; min-height: 0; }
        .chart-container-btm { flex: 1; position: relative; border-top: 1px solid #444; background: #000; padding: 5px; min-height: 0; }
        canvas { width: 100% !important; height: 100% !important; }
        
        .draggable-panel { position: absolute; z-index: 5000; background: rgba(0,0,0,0.9); border-radius: 10px; border: 2px solid #555; overflow: hidden; touch-action: none; }
        .panel-header { background: #444; color: white; font-size: 11px; padding: 8px; text-align: center; cursor: move; font-weight: bold; }
        #data-dashboard { top: 10px; right: 10px; min-width: 220px; }
        #dash-content { padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; color: #fff; pointer-events: none; }
        .dash-row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
        .sector-val { color: var(--sec-yellow); font-weight: bold; }

        #offset-panel { bottom: 20px; left: 10px; padding: 5px; display: flex; flex-direction: column; gap: 5px; }
        .adj-btn { width: 40px; height: 40px; background: #333; color: white; border: 1px solid #666; border-radius: 5px; font-size: 20px; cursor: pointer; }

        #lap-list-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; }
        .list-header { background: #1a1a1a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--hrc-red); }
        #lap-table-container { flex: 1; overflow-y: auto; padding: 10px; }
        table { width: 100%; border-collapse: collapse; color: #fff; text-align: center; }
        th { background: #333; padding: 12px; position: sticky; top: 0; }
        td { padding: 16px 5px; border-bottom: 1px solid #333; cursor: pointer; }
        .row-l1 { background: rgba(255, 68, 68, 0.7) !important; font-weight: bold; }
        .row-l2 { background: rgba(51, 204, 255, 0.7) !important; font-weight: bold; }

        #controls { position: fixed; bottom: 0; left: 0; width: 100%; height: 105px; background: #1a1a1a; padding: 5px; display: flex; flex-direction: column; z-index: 9999; }
        .ctrl-row { display: flex; align-items: center; gap: 4px; flex: 1; overflow-x: auto; white-space: nowrap; }
        .mini-btn { background: #444; color: white; border: none; padding: 0 12px; border-radius: 4px; font-size: 10px; font-weight: bold; height: 38px; flex-shrink: 0; cursor: pointer; }
        #seek-bar { width: 100%; height: 40px; accent-color: #ff4444; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map"></div>
    <div id="chart-area">
        <div id="data-dashboard" class="draggable-panel">
            <div class="panel-header" id="dash-handle">✜ DASHBOARD</div>
            <div id="dash-content">
                <div class="dash-row"><span>TIME:</span><span id="dash-time">0.00s</span></div>
                <div class="dash-row" style="color:var(--hrc-red)"><span>L1 SPD:</span><span id="dash-l1-info">--- km/h</span></div>
                <div class="dash-row" style="color:var(--hrc-green)"><span>L1 RPM:</span><span id="dash-rpm-info">---</span></div>
                <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
                <div class="dash-row"><span style="color:#aaa">START~S1:</span><span id="s1-val" class="sector-val">--.---s</span></div>
                <div class="dash-row"><span style="color:#aaa">S1~S2:</span><span id="s2-val" class="sector-val">--.---s</span></div>
                <div class="dash-row" style="color:var(--hrc-blue); font-weight:bold; margin-top:5px;"><span>GAP:</span><span id="dash-gap-info">0.000s</span></div>
            </div>
        </div>

        <div id="offset-panel" class="draggable-panel">
            <div class="panel-header" id="offset-handle">✜ MAP ADJ</div>
            <div style="display:flex; flex-direction:column; gap:5px; align-items:center; padding:5px;">
                <button class="adj-btn" onclick="adjustMap(0, 0.00002)">↑</button>
                <div style="display:flex; gap:5px;"><button class="adj-btn" onclick="adjustMap(-0.00002, 0)">←</button><button class="adj-btn" onclick="adjustMap(0.00002, 0)">→</button></div>
                <button class="adj-btn" onclick="adjustMap(0, -0.00002)">↓</button>
            </div>
        </div>

        <div class="chart-container-top"><canvas id="telemetryChart"></canvas></div>
        <div class="chart-container-btm"><canvas id="deltaChart"></canvas></div>
    </div>
</div>

<div id="lap-list-overlay">
    <div class="list-header"><h2>LAP LIST</h2><button class="mini-btn" id="closeListBtn" style="background:var(--hrc-red)">CLOSE</button></div>
    <div id="lap-table-container"><table><thead><tr><th>LAP</th><th>TIME</th><th>MAX SPD</th></tr></thead><tbody id="lap-table-body"></tbody></table></div>
</div>

<div id="controls">
    <div class="ctrl-row">
        <button class="mini-btn" id="playBtn" style="background:var(--hrc-red)">PLAY</button>
        <button class="mini-btn" id="fileBtn">FILE OPEN</button>
        <button class="mini-btn" id="openListBtn" style="background:var(--hrc-blue)">LAP LIST</button>
        <button class="mini-btn" id="s1SetBtn" style="background:var(--sec-yellow);color:#000">S1 SET</button>
        <button class="mini-btn" id="s2SetBtn" style="background:var(--sec-yellow);color:#000">S2 SET</button>
        <button class="mini-btn" onclick="location.reload()" style="background:#222">RESET</button>
    </div>
    <input type="range" id="seek-bar" value="0" min="0" step="1">
    <input type="file" id="fileInput" accept=".gpx" style="display:none">
</div>

<script>
'use strict';
let map, marker1, marker2, telChart, deltaChart;
let lapDataStore = [], currentFrame = 0, isPlaying = false;
let primaryIdx = -1, secondaryIdx = -1, s1Idx = null, s2Idx = null;
let mapOffset = { lat: 0, lon: 0 }, sessionMaxSpeed = 0;

// 地図の初期化
map = L.map('map', { zoomControl: false, maxZoom: 22 }).setView([35.68, 139.76], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);
marker1 = L.circleMarker([0,0], {color:'#fff', fillColor:'#f44', radius:8, fillOpacity:1, weight:2, zIndexOffset:1000});
marker2 = L.circleMarker([0,0], {color:'#fff', fillColor:'#3cf', radius:6, fillOpacity:1, weight:2, zIndexOffset:900});

// ファイル読み込みボタンの動作修正
const fInput = document.getElementById('fileInput');
document.getElementById('fileBtn').addEventListener('click', () => {
    fInput.click();
});

fInput.addEventListener('change', e => {
    if (e.target.files.length === 0) return;
    const r = new FileReader();
    r.onload = evt => parseGPX(new DOMParser().parseFromString(evt.target.result, "text/xml"));
    r.readAsText(e.target.files[0]);
});

function parseGPX(xml) {
    const trks = xml.getElementsByTagName('trk');
    if (!trks.length) { alert("GPX形式が正しくありません"); return; }
    lapDataStore = []; let allPts = []; sessionMaxSpeed = 0;
    for (let i = 0; i < trks.length; i++) {
        const pts = trks[i].getElementsByTagName('trkpt');
        if (!pts.length) continue;
        let spds = [], crds = [], tms = [], dsts = [], rpms = [], dAcc = 0, maxV = 0;
        const startT = new Date(pts[0].getElementsByTagName('time')[0].textContent);
        for (let j = 0; j < pts.length; j++) {
            const lat = parseFloat(pts[j].getAttribute('lat')), lon = parseFloat(pts[j].getAttribute('lon'));
            const s = Math.round(parseFloat(pts[j].getElementsByTagName('speed')[0]?.textContent || 0) * 3.6);
            let r = parseInt(pts[j].getElementsByTagName('gpxtpx:hr')[0]?.textContent || 0);
            if (r < 0) r = 0; 
            if (j > 0) dAcc += L.latLng(crds[j-1]).distanceTo([lat, lon]);
            if (s > maxV) maxV = s;
            spds.push(s); crds.push([lat, lon]); rpms.push(r); allPts.push([lat, lon]);
            tms.push((new Date(pts[j].getElementsByTagName('time')[0].textContent) - startT) / 1000);
            dsts.push(dAcc);
        }
        if (maxV > sessionMaxSpeed) sessionMaxSpeed = maxV;
        lapDataStore.push({ speeds: spds, coords: crds, times: tms, dists: dsts, rpms: rpms, duration: tms[tms.length-1], maxV });
    }
    if (lapDataStore.length > 0) { 
        primaryIdx = 0; secondaryIdx = -1; s1Idx = null; s2Idx = null; 
        map.fitBounds(L.latLngBounds(allPts)); updateUI(); 
    }
}

function adjustMap(dLon, dLat) { mapOffset.lat += dLat; mapOffset.lon += dLon; drawMapLines(); updateFrame(); }

function drawMapLines() {
    if (primaryIdx === -1) return;
    if (window.pathLayer) map.removeLayer(window.pathLayer);
    const g = L.featureGroup();
    const drawHeat = (idx, isSec) => {
        const p = lapDataStore[idx];
        for (let i = 0; i < p.coords.length - 1; i++) {
            const ratio = Math.min(p.speeds[i] / sessionMaxSpeed, 1);
            L.polyline([[p.coords[i][0] + mapOffset.lat, p.coords[i][1] + mapOffset.lon], [p.coords[i+1][0] + mapOffset.lat, p.coords[i+1][1] + mapOffset.lon]], 
            { color: `hsl(${(1-ratio)*240}, 100%, 50%)`, weight: isSec ? 2 : 5, opacity: isSec ? 0.3 : 1 }).addTo(g);
        }
    };
    if (secondaryIdx !== -1) drawHeat(secondaryIdx, true);
    drawHeat(primaryIdx, false);
    window.pathLayer = g.addTo(map);
}

function updateFrame() {
    if (primaryIdx === -1) return;
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    const idx = Math.min(currentFrame, p.speeds.length - 1);
    marker1.setLatLng([p.coords[idx][0] + mapOffset.lat, p.coords[idx][1] + mapOffset.lon]).addTo(map);
    
    document.getElementById('dash-time').innerText = `${p.times[idx].toFixed(2)}s`;
    document.getElementById('dash-l1-info').innerText = `${p.speeds[idx]} km/h`;
    document.getElementById('dash-rpm-info').innerText = `${p.rpms[idx]}`;

    if (s1Idx !== null) document.getElementById('s1-val').innerText = `${p.times[Math.min(s1Idx, p.times.length-1)].toFixed(3)}s`;
    if (s1Idx !== null && s2Idx !== null) {
        const t1 = p.times[Math.min(s1Idx, p.times.length-1)], t2 = p.times[Math.min(s2Idx, p.times.length-1)];
        document.getElementById('s2-val').innerText = `${Math.abs(t2 - t1).toFixed(3)}s`;
    }

    if (s) {
        let sIdx = 0, minDist = Infinity, curD = p.dists[idx];
        for(let j=0; j<s.dists.length; j++) { let d=Math.abs(s.dists[j]-curD); if(d<minDist){minDist=d; sIdx=j;} }
        if(!map.hasLayer(marker2)) marker2.addTo(map);
        marker2.setLatLng([s.coords[sIdx][0] + mapOffset.lat, s.coords[sIdx][1] + mapOffset.lon]);
        document.getElementById('dash-gap-info').innerText = `${(p.times[idx] - s.times[sIdx]).toFixed(3)}s`;
    } else {
        if(map.hasLayer(marker2)) map.removeLayer(marker2);
        document.getElementById('dash-gap-info').innerText = `0.000s`;
    }
    
    [telChart, deltaChart].forEach(c => { if(c) { c.options.plugins.annotation.annotations.now.xMin = idx; c.options.plugins.annotation.annotations.now.xMax = idx; c.update('none'); } });
}

function createCharts() {
    const ctxT = document.getElementById('telemetryChart').getContext('2d');
    const ctxD = document.getElementById('deltaChart').getContext('2d');
    const p = lapDataStore[primaryIdx], s = secondaryIdx >= 0 ? lapDataStore[secondaryIdx] : null;
    if (telChart) telChart.destroy();
    if (deltaChart) deltaChart.destroy();

    const annotations = { now: { type: 'line', xMin: 0, xMax: 0, borderColor: '#fff', borderWidth: 2, zIndex: 10 } };
    if (s1Idx !== null) annotations.s1 = { type: 'line', xMin: s1Idx, xMax: s1Idx, borderColor: 'yellow', borderWidth: 2, label: { content: 'S1', display: true, position: 'start', backgroundColor: 'rgba(255,255,0,0.5)' } };
    if (s2Idx !== null) annotations.s2 = { type: 'line', xMin: s2Idx, xMax: s2Idx, borderColor: 'yellow', borderWidth: 2, label: { content: 'S2', display: true, position: 'start', backgroundColor: 'rgba(255,255,0,0.5)' } };

    const telDatasets = [
        { label: 'L1 SPD', data: p.speeds, borderColor: '#f44', yAxisID: 'y', pointRadius:0, borderWidth: 2.5 },
        { label: 'L1 RPM', data: p.rpms, borderColor: '#0f0', yAxisID: 'y1', pointRadius:0, fill: true, backgroundColor: 'rgba(0,255,0,0.1)', borderWidth: 1.5 }
    ];

    if (s) {
        const sMappedSpd = p.dists.map(d => { let l=0, r=s.dists.length-1; while(l<r){ let m=(l+r)>>1; if(s.dists[m]<d)l=m+1; else r=m; } return s.speeds[l]; });
        const sMappedRpm = p.dists.map(d => { let l=0, r=s.dists.length-1; while(l<r){ let m=(l+r)>>1; if(s.dists[m]<d)l=m+1; else r=m; } return s.rpms[l]; });
        telDatasets.push({ label: 'L2 SPD', data: sMappedSpd, borderColor: '#3cf', borderWidth: 1.2, borderDash: [5,5], pointRadius: 0, yAxisID: 'y' });
        telDatasets.push({ label: 'L2 RPM', data: sMappedRpm, borderColor: '#0f0', borderWidth: 1, borderDash: [3,3], pointRadius: 0, yAxisID: 'y1' });
    }

    telChart = new Chart(ctxT, {
        type: 'line', data: { labels: p.times.map((_,i)=>i), datasets: telDatasets },
        options: { 
            responsive: true, maintainAspectRatio: false, animation: false, 
            scales: { 
                x: { display: false }, 
                y: { position: 'left', ticks: { color: '#f44', font: { size: 10 } } }, 
                y1: { position: 'right', min: 0, grid: { drawOnChartArea: false }, ticks: { color: '#0f0', font: { size: 10 } } } 
            }, 
            plugins: { legend: { display: false }, annotation: { annotations } } 
        }
    });

    let gapData = new Array(p.speeds.length).fill(0);
    if (s) {
        p.dists.forEach((d, i) => {
            let l=0, r=s.dists.length-1; while(l<r){ let m=(l+r)>>1; if(s.dists[m]<d)l=m+1; else r=m; }
            gapData[i] = p.times[i] - s.times[l];
        });
    }
    deltaChart = new Chart(ctxD, {
        type: 'line', data: { labels: p.times.map((_,i)=>i), datasets: [{ data: gapData, borderColor: '#3cf', borderWidth: 1.5, pointRadius: 0, fill: 'origin', backgroundColor: 'rgba(51, 204, 255, 0.2)' }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { display: false }, y: { ticks: { color: '#3cf', font: { size: 9 } }, grid: { color: '#333' } } }, plugins: { legend: { display: false }, annotation: { annotations } } }
    });
}

function updateUI() { 
    if(primaryIdx === -1) return; 
    document.getElementById('seek-bar').max = lapDataStore[primaryIdx].speeds.length - 1; 
    drawMapLines(); 
    createCharts(); 
    updateFrame(); 
}

function renderLapTable() {
    const tbody = document.getElementById('lap-table-body'); tbody.innerHTML = '';
    lapDataStore.forEach((lap, i) => {
        const tr = document.createElement('tr');
        if (i === primaryIdx) tr.className = 'row-l1'; else if (i === secondaryIdx) tr.className = 'row-l2';
        tr.innerHTML = `<td>L${i+1}</td><td>${lap.duration.toFixed(3)}s</td><td>${lap.maxV}km/h</td>`;
        tr.onclick = () => { if (primaryIdx === i) { primaryIdx = secondaryIdx; secondaryIdx = -1; } else if (secondaryIdx === i) { secondaryIdx = -1; } else { if (primaryIdx === -1) primaryIdx = i; else secondaryIdx = i; } renderLapTable(); updateUI(); };
        tbody.appendChild(tr);
    });
}

document.getElementById('openListBtn').onclick = () => { renderLapTable(); document.getElementById('lap-list-overlay').style.display = 'flex'; };
document.getElementById('closeListBtn').onclick = () => document.getElementById('lap-list-overlay').style.display = 'none';
document.getElementById('seek-bar').oninput = () => { currentFrame = parseInt(document.getElementById('seek-bar').value); updateFrame(); };
document.getElementById('s1SetBtn').onclick = () => { s1Idx = currentFrame; updateUI(); };
document.getElementById('s2SetBtn').onclick = () => { s2Idx = currentFrame; updateUI(); };
const pB = document.getElementById('playBtn');
pB.onclick = () => { isPlaying = !isPlaying; pB.innerText = isPlaying ? "PAUSE" : "PLAY"; if (isPlaying) animate(); };
function animate() { if (!isPlaying) return; if (currentFrame >= lapDataStore[primaryIdx].speeds.length - 1) { isPlaying = false; pB.innerText = "PLAY"; } else { currentFrame++; document.getElementById('seek-bar').value = currentFrame; updateFrame(); requestAnimationFrame(animate); } }

function makeDraggable(el, handle) {
    let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    const dragStart = (e) => { initialX = (e.touches ? e.touches[0].clientX : e.clientX) - xOffset; initialY = (e.touches ? e.touches[0].clientY : e.clientY) - yOffset; if (e.target === handle) active = true; };
    const drag = (e) => { if (!active) return; e.preventDefault(); currentX = (e.touches ? e.touches[0].clientX : e.clientX) - initialX; currentY = (e.touches ? e.touches[0].clientY : e.clientY) - initialY; xOffset = currentX; yOffset = currentY; el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`; };
    handle.addEventListener("mousedown", dragStart); handle.addEventListener("touchstart", dragStart);
    window.addEventListener("mousemove", drag); window.addEventListener("touchmove", drag, {passive:false});
    window.addEventListener("mouseup", () => active = false); window.addEventListener("touchend", () => active = false);
}
makeDraggable(document.getElementById('data-dashboard'), document.getElementById('dash-handle'));
makeDraggable(document.getElementById('offset-panel'), document.getElementById('offset-handle'));
</script>
</body>
</html>
